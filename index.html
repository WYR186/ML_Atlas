<!doctype html>
<html lang="zh-CN" data-lang="cn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ECE 449 / CS 446 · ML Atlas</title>
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="index.html">
      <span class="logo">ML</span>
      <span data-i18n="brand.title">ECE 449 / CS 446 · 期末复习路线图</span>
    </a>
    <nav class="nav-links">
      <a href="index.html" class="active" data-i18n="nav.roadmap">🗺️ 路线图</a>
      <a href="topics/probability.html" data-i18n="nav.notes">📘 速查</a>
      <a href="cheatsheet.html" data-i18n="nav.cheatsheet">⚡ 速记</a>
      <a href="resources.html" data-i18n="nav.resources">📂 资料</a>
    </nav>
    <div class="spacer"></div>
    <div class="search-box">
      <input id="searchInput" type="text" placeholder="搜索算法…" data-i18n="search.placeholder" data-i18n-attr="placeholder" />
    </div>
  </div>
</header>

<div class="page">
  <section class="hero">
    <aside class="side-card">
      <h3 data-i18n="home.progress">📊 复习进度</h3>
      <div class="progress-ring">
        <div class="ring">
          <svg width="78" height="78" viewBox="0 0 78 78">
            <circle cx="39" cy="39" r="33" fill="none" stroke="#e5e7eb" stroke-width="6"/>
            <circle id="progressCircle" cx="39" cy="39" r="33" fill="none"
              stroke="#10b981" stroke-width="6"
              stroke-dasharray="207.3" stroke-dashoffset="207.3"
              stroke-linecap="round"/>
          </svg>
          <div class="ring-text">
            <span class="num" id="progressNum">0</span>
            <span class="total">/<span id="progressTotal">37</span></span>
          </div>
        </div>
        <div class="legend">
          <div><span class="dot green"></span><span data-i18n="home.legend.found">基础 / 简单</span></div>
          <div><span class="dot yellow"></span><span data-i18n="home.legend.dl">中等</span></div>
          <div><span class="dot red"></span><span data-i18n="home.legend.theory">困难</span></div>
        </div>
      </div>
      <div class="side-actions">
        <a class="btn btn-primary" href="cheatsheet.html" data-i18n="home.btn.cheatsheet">⚡ 1 小时速记</a>
        <a class="btn" href="topics/probability.html" data-i18n="home.btn.start">📖 从头开始</a>
        <a class="btn" href="resources.html" data-i18n="home.btn.resources">📂 课件 & 作业</a>
        <button class="btn" id="resetProgress" data-i18n="home.btn.reset">🔄 重置进度</button>
      </div>
    </aside>

    <div class="roadmap" id="roadmap">
      <a class="section-node" href="#" style="left:50%; transform:translateX(-50%); top:16px; width:280px;">
        <span data-i18n="brand.short">ECE 449 / CS 446</span>
        <span class="sub" data-i18n="home.subtitle.subtitle">机器学习 · 期末复习</span>
      </a>
      <div id="groupGrid" style="margin-top: 110px;"></div>
    </div>
  </section>

  <section style="margin-top: 28px;">
    <h2 style="margin: 0 0 6px; font-size: 20px;" data-i18n="home.indexTitle">📚 完整核心算法表</h2>
    <p style="margin: 0 0 14px; color: var(--text-soft); font-size: 14px;" data-i18n="home.indexSub">每个算法独立成页 · 点击行进入详情。</p>
    <div id="indexTable"></div>
  </section>
</div>

<footer>
  <span data-i18n="footer.home">ML Atlas · ECE 449 / CS 446 期末复习 ·</span>
  <a href="resources.html" data-i18n="footer.viewMap">资源映射</a>
</footer>

<script src="assets/i18n.js"></script>
<script src="assets/topics-data.js"></script>
<script src="assets/main.js"></script>
<script>
  // === Render group grid (one card per algorithm) ===
  (function () {
    const grid = document.getElementById("groupGrid");
    if (!grid || !window.GROUPS || !window.TOPICS) return;
    const lang = (localStorage.getItem("ml_review_lang_v1") || "cn");
    const total = document.getElementById("progressTotal");
    if (total) total.textContent = window.TOPICS.length;

    grid.style.display = "grid";
    grid.style.gap = "20px";
    grid.style.gridTemplateColumns = "repeat(2, 1fr)";

    const order = [
      ["foundations"],
      ["supervised"],
      ["trees", "unsupervised"],
      ["neural"],
      ["sequential", "representation"],
      ["modern"],
      ["generative", "theory"],
      ["rl"],
    ];

    function nameFor(g, lang) {
      return lang === "en" ? g.name_en : g.name_cn;
    }
    function topicLabel(t, lang) {
      return lang === "en" ? t.name_en : t.name_cn;
    }
    const diffColor = { green: "var(--accent)", yellow: "var(--warn)", red: "var(--danger)" };

    function renderGroup(gid) {
      const g = window.GROUPS.find(x => x.id === gid);
      if (!g) return "";
      const items = window.TOPICS.filter(t => t.group === gid);
      const cards = items.map(t => `
        <a class="node" href="topics/${t.slug}.html" data-slug="${t.slug}">
          <span class="difficulty" style="background:${diffColor[t.diff]||'var(--border)'};"></span>
          <span class="topic-label" data-cn="${t.name_cn}" data-en="${t.name_en}">${t.name_cn}</span>
          <span class="progress-bar"><span class="fill"></span></span>
        </a>
      `).join("");
      const cols = items.length >= 4 ? "repeat(2, 1fr)" : (items.length >= 2 ? `repeat(${Math.min(items.length, 3)}, 1fr)` : "1fr");
      return `
        <div class="group" style="position:relative; padding:18px 16px 14px; border:1px solid var(--border-strong); border-radius:12px; background:rgba(255,255,255,0.7);">
          <span class="group-label" data-cn="${g.name_cn}" data-en="${g.name_en}">${g.name_cn}</span>
          <div class="group-cards" style="grid-template-columns: ${cols}; margin-top:6px;">
            ${cards}
          </div>
        </div>
      `;
    }

    grid.innerHTML = order.map(row => {
      if (row.length === 1) {
        return `<div style="grid-column: 1 / 3;">${renderGroup(row[0])}</div>`;
      }
      return row.map(g => `<div>${renderGroup(g)}</div>`).join("");
    }).join("");

    // Apply CN/EN to topic labels and group labels
    function applyTopicLang() {
      const lang = (localStorage.getItem("ml_review_lang_v1") || "cn");
      grid.querySelectorAll("[data-cn][data-en]").forEach(el => {
        el.textContent = lang === "en" ? el.dataset.en : el.dataset.cn;
      });
    }
    applyTopicLang();
    document.querySelectorAll(".lang-switch button").forEach(btn => {
      btn.addEventListener("click", () => setTimeout(applyTopicLang, 0));
    });

    // Mark progress dots
    function markProgress() {
      const p = JSON.parse(localStorage.getItem("ml_review_progress_v1") || "{}");
      let done = 0;
      grid.querySelectorAll(".node[data-slug]").forEach(el => {
        if (p[el.dataset.slug]) {
          el.classList.add("done");
          done += 1;
        }
      });
      const num = document.getElementById("progressNum");
      const circle = document.getElementById("progressCircle");
      if (num) num.textContent = done;
      if (circle) {
        const C = 2 * Math.PI * 33;
        circle.setAttribute("stroke-dasharray", C.toFixed(2));
        circle.setAttribute("stroke-dashoffset", (C * (1 - done / window.TOPICS.length)).toFixed(2));
      }
    }
    markProgress();
  })();

  // === Render index table per group ===
  (function () {
    const root = document.getElementById("indexTable");
    if (!root || !window.GROUPS || !window.TOPICS) return;

    const html = window.GROUPS.map(g => {
      const items = window.TOPICS.filter(t => t.group === g.id);
      if (!items.length) return "";
      return `
        <div style="background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; margin-bottom: 10px;">
          <h3 style="margin:0 0 8px; font-size:16px;">
            <span data-cn="${g.name_cn}" data-en="${g.name_en}">${g.name_cn}</span>
            <span style="color:var(--text-muted); font-size:13px; font-weight:500; margin-left:8px;">${g.sub}</span>
          </h3>
          <div style="display:grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap:6px;">
            ${items.map(t => `
              <a href="topics/${t.slug}.html" style="display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:6px; color:var(--text); text-decoration:none; font-size:13.5px;">
                <span style="width:6px; height:6px; border-radius:50%; background:${({green:'var(--accent)',yellow:'var(--warn)',red:'var(--danger)'})[t.diff]};"></span>
                <span data-cn="${t.name_cn}" data-en="${t.name_en}">${t.name_cn}</span>
                <span style="color:var(--text-muted); font-size:12px; margin-left:auto;">${t.sub}</span>
              </a>
            `).join("")}
          </div>
        </div>
      `;
    }).join("");
    root.innerHTML = html;

    // Apply lang
    function applyLang() {
      const lang = (localStorage.getItem("ml_review_lang_v1") || "cn");
      root.querySelectorAll("[data-cn][data-en]").forEach(el => {
        el.textContent = lang === "en" ? el.dataset.en : el.dataset.cn;
      });
    }
    applyLang();
    document.querySelectorAll(".lang-switch button").forEach(btn => {
      btn.addEventListener("click", () => setTimeout(applyLang, 0));
    });
  })();
</script>
</body>
</html>
