<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="title desc">
  <title id="title">Grid world values without Bellman backups</title>
  <desc id="desc">A 4 by 3 grid world with a goal, a fire penalty, a wall, and rough values assigned as one along the path.</desc>
  <defs>
    <style>
      .label { font-family: Inter, Arial, sans-serif; fill: #020617; }
      .small { font-size: 24px; font-weight: 750; }
      .value { font-size: 35px; font-weight: 780; }
      .cell { fill: #d8efcf; stroke: #020617; stroke-width: 1.7; }
      .wall { fill: #000000; stroke: #020617; stroke-width: 1.7; }
      .icon { fill: #020617; stroke: #020617; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="720" height="540" fill="#f8fafc"/>
  <text class="label" x="360" y="48" text-anchor="middle" font-size="29" font-weight="850">Before Bellman Backups</text>
  <text class="label" x="360" y="80" text-anchor="middle" font-size="18" fill="#475569">Values are not yet distance-aware.</text>

  <g transform="translate(72 100)">
    <rect class="cell" x="0" y="0" width="144" height="144"/>
    <rect class="cell" x="144" y="0" width="144" height="144"/>
    <rect class="cell" x="288" y="0" width="144" height="144"/>
    <rect class="cell" x="432" y="0" width="144" height="144"/>
    <rect class="cell" x="0" y="144" width="144" height="144"/>
    <rect class="wall" x="144" y="144" width="144" height="144"/>
    <rect class="cell" x="288" y="144" width="144" height="144"/>
    <rect class="cell" x="432" y="144" width="144" height="144"/>
    <rect class="cell" x="0" y="288" width="144" height="144"/>
    <rect class="cell" x="144" y="288" width="144" height="144"/>
    <rect class="cell" x="288" y="288" width="144" height="144"/>
    <rect class="cell" x="432" y="288" width="144" height="144"/>

    <text class="label value" x="72" y="82" text-anchor="middle">V = 1</text>
    <text class="label value" x="216" y="82" text-anchor="middle">V = 1</text>
    <text class="label value" x="360" y="82" text-anchor="middle">V = 1</text>
    <text class="label value" x="72" y="226" text-anchor="middle">V = 1</text>
    <text class="label value" x="360" y="226" text-anchor="middle">V = 1</text>
    <text class="label value" x="72" y="411" text-anchor="middle">V = 1</text>
    <text class="label value" x="216" y="370" text-anchor="middle">V = 1</text>
    <text class="label value" x="360" y="370" text-anchor="middle">V = 1</text>
    <text class="label value" x="504" y="370" text-anchor="middle">V = 1</text>

    <g transform="translate(504 36) scale(1.1)">
      <path class="icon" d="M-28 -16 h56 v8 c0 22 -12 36 -28 36 s-28 -14 -28 -36 z" fill="none"/>
      <path class="icon" d="M-30 -10 h-18 c0 18 9 30 27 34" fill="none"/>
      <path class="icon" d="M30 -10 h18 c0 18 -9 30 -27 34" fill="none"/>
      <path class="icon" d="M0 28 v24 M-18 52 h36 M-28 66 h56" fill="none"/>
    </g>
    <text class="label value" x="504" y="132" text-anchor="middle">R = 1</text>

    <g transform="translate(504 207) scale(1.05)">
      <path class="icon" d="M4 -42 c26 27 -4 38 12 64 10 -11 12 -24 8 -37 25 20 21 56 -6 70 -31 17 -66 -5 -63 -39 2 -22 18 -34 35 -48 -2 16 1 27 14 35 -8 -18 -7 -31 0 -45z"/>
    </g>
    <text class="label value" x="504" y="276" text-anchor="middle">R = -1</text>

    <g transform="translate(72 335)">
      <rect x="-31" y="-18" width="62" height="42" rx="10" fill="none" stroke="#020617" stroke-width="5"/>
      <circle cx="-15" cy="3" r="5" fill="#020617"/>
      <circle cx="15" cy="3" r="5" fill="#020617"/>
      <path d="M-18 22 h36 M-24 34 h48" fill="none" stroke="#020617" stroke-width="5" stroke-linecap="round"/>
      <path d="M-24 -18 l-16 -22 M24 -18 l16 -22 M-39 -42 v12 M39 -42 v12" fill="none" stroke="#020617" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
