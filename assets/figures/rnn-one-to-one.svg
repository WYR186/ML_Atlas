<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460" role="img" aria-labelledby="title desc">
  <title id="title">One-to-one neural network pattern</title>
  <desc id="desc">A single input maps to a single hidden representation and then to a single output.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#111827"/>
    </marker>
    <style>
      .title{font:800 27px Arial,sans-serif;fill:#111827}
      .label{font:700 21px Arial,sans-serif;fill:#111827}
      .box{fill:none;stroke:#111827;stroke-width:1.5}
      .input{fill:#006b2f;stroke:#111827;stroke-width:1.3}
      .state{fill:#22954b;stroke:#111827;stroke-width:1.3}
      .output{fill:#dff4d7;stroke:#111827;stroke-width:1.3}
      .arrow{stroke:#111827;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="360" height="460" fill="#f8fafc"/>
  <text x="180" y="42" text-anchor="middle" class="title">One to One</text>
  <text x="88" y="138" text-anchor="middle" class="label">Single Output</text>
  <text x="86" y="356" text-anchor="middle" class="label">Single Input</text>
  <rect class="box" x="190" y="64" width="118" height="346" rx="8"/>
  <rect class="output" x="224" y="95" width="48" height="92" rx="7"/>
  <rect class="state" x="224" y="216" width="48" height="92" rx="7"/>
  <rect class="input" x="224" y="337" width="48" height="92" rx="7"/>
  <path class="arrow" d="M248 337V311"/>
  <path class="arrow" d="M248 216V190"/>
</svg>
