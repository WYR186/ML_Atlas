<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">Transformers in LLMs flow</title>
  <desc id="desc">A high-level LLM Transformer flow: input, embedding plus positional encoding, encoder block, decoder block, and output.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <filter id="shadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 800 39px Arial, sans-serif; fill: #111827; }
      .label { font: 800 26px Arial, sans-serif; fill: #111827; }
      .sub { font: 700 24px Arial, sans-serif; fill: #111827; }
      .tiny { font: 600 11px Arial, sans-serif; fill: #28935b; }
      .box { fill: #ffffff; stroke: #111827; stroke-width: 1.3; rx: 6; filter: url(#shadow); }
      .wire { stroke: #111827; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .green { fill: #27965a; stroke: #27965a; }
      .greenLine { stroke: #27965a; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="800" height="400" fill="#f8fafc"/>
  <text x="400" y="46" text-anchor="middle" class="title">Transformers in LLMs</text>

  <rect x="18" y="70" width="184" height="122" class="box"/>
  <path d="M91 81 h32 l10 10 v45 h-42 z" class="green"/>
  <path d="M123 81 v11 h11" fill="#dff5e9"/>
  <line x1="101" y1="100" x2="125" y2="100" stroke="#ffffff" stroke-width="3"/>
  <line x1="101" y1="112" x2="125" y2="112" stroke="#ffffff" stroke-width="3"/>
  <line x1="101" y1="124" x2="118" y2="124" stroke="#ffffff" stroke-width="3"/>
  <text x="110" y="176" text-anchor="middle" class="label">Input</text>

  <rect x="276" y="70" width="248" height="122" class="box"/>
  <g transform="translate(375 78)">
    <rect x="0" y="0" width="48" height="48" class="green"/>
    <path d="M8 0 v48 M18 0 v48 M29 0 v48 M40 0 v48 M0 8 h48 M0 18 h48 M0 29 h48 M0 40 h48" stroke="#dff5e9" stroke-width="2"/>
    <path d="M2 46 C18 33 22 14 46 2" stroke="#ffffff" stroke-width="2.4" fill="none"/>
  </g>
  <text x="400" y="147" text-anchor="middle" class="sub">Embedding +</text>
  <text x="400" y="177" text-anchor="middle" class="sub">Positional Encoding</text>

  <rect x="598" y="70" width="184" height="122" class="box"/>
  <g transform="translate(660 78)">
    <line x1="30" y1="42" x2="30" y2="6" class="greenLine"/>
    <path d="M22 14 l8 -8 l8 8" class="greenLine"/>
    <line x1="12" y1="42" x2="12" y2="28" class="greenLine"/>
    <line x1="48" y1="42" x2="48" y2="28" class="greenLine"/>
    <line x1="12" y1="28" x2="48" y2="28" class="greenLine"/>
    <circle cx="12" cy="47" r="6" fill="#e8f7ed" stroke="#27965a" stroke-width="3"/>
    <circle cx="30" cy="47" r="6" fill="#e8f7ed" stroke="#27965a" stroke-width="3"/>
    <circle cx="48" cy="47" r="6" fill="#e8f7ed" stroke="#27965a" stroke-width="3"/>
  </g>
  <text x="690" y="146" text-anchor="middle" class="label">Encoder</text>
  <text x="690" y="176" text-anchor="middle" class="label">Block</text>

  <rect x="480" y="268" width="302" height="122" class="box"/>
  <g transform="translate(604 280)">
    <path d="M0 0 h48 v37 h-48 z" class="green"/>
    <rect x="6" y="7" width="8" height="8" fill="#ffffff"/>
    <rect x="19" y="7" width="8" height="8" fill="#ffffff"/>
    <rect x="32" y="7" width="8" height="8" fill="#ffffff"/>
    <text x="8" y="30" class="tiny">0101</text>
    <circle cx="48" cy="39" r="11" fill="#e8f7ed" stroke="#27965a" stroke-width="3"/>
    <path d="M45 45 l7 -9 h-6 l4 -7" stroke="#27965a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="631" y="371" text-anchor="middle" class="label">Decoder Block</text>

  <rect x="18" y="268" width="300" height="122" class="box"/>
  <g transform="translate(141 283)">
    <rect x="4" y="0" width="44" height="48" rx="4" fill="#e8f7ed" stroke="#27965a" stroke-width="3"/>
    <path d="M10 9 h32 M10 18 h32 M10 27 h25 M10 36 h28" class="greenLine" stroke-width="2.4"/>
    <path d="M5 -1 h-7 v10 M47 -1 h7 v10 M5 49 h-7 v-10 M47 49 h7 v-10" class="greenLine"/>
    <text x="14" y="22" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#27965a">A</text>
  </g>
  <text x="168" y="371" text-anchor="middle" class="label">Output</text>

  <line x1="202" y1="129" x2="276" y2="129" class="wire"/>
  <line x1="524" y1="129" x2="598" y2="129" class="wire"/>
  <path d="M690 192 V268" class="wire"/>
  <line x1="480" y1="329" x2="318" y2="329" class="wire"/>
</svg>
