<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">How PCA summarizes many colours into dominant components</title>
  <desc id="desc">A PCA intuition diagram showing a multi-colour feature block compressed into a few dominant colour bands.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <linearGradient id="noiseA" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.32" stop-color="#a3e635"/>
      <stop offset="0.58" stop-color="#06b6d4"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <style>
      .title{font:800 34px Arial,sans-serif;fill:#111827}
      .label{font:800 24px Arial,sans-serif;fill:#111827}
      .small{font:600 15px Arial,sans-serif;fill:#334155}
      .arrow{stroke:#111827;stroke-width:8;fill:none;marker-end:url(#arrow)}
      .tile{stroke:#00000014;stroke-width:1}
    </style>
  </defs>
  <rect width="960" height="480" fill="#f8fafc"/>
  <text x="480" y="58" text-anchor="middle" class="title">How PCA Works</text>

  <g transform="translate(100,100)">
    <rect x="0" y="0" width="300" height="300" fill="url(#noiseA)" stroke="#e2e8f0" stroke-width="2"/>
    <g opacity="0.45">
      <rect class="tile" x="0" y="0" width="30" height="30" fill="#fb923c"/>
      <rect class="tile" x="30" y="0" width="30" height="30" fill="#f97316"/>
      <rect class="tile" x="60" y="0" width="30" height="30" fill="#f59e0b"/>
      <rect class="tile" x="90" y="0" width="30" height="30" fill="#facc15"/>
      <rect class="tile" x="120" y="0" width="30" height="30" fill="#a3e635"/>
      <rect class="tile" x="150" y="0" width="30" height="30" fill="#22c55e"/>
      <rect class="tile" x="180" y="0" width="30" height="30" fill="#14b8a6"/>
      <rect class="tile" x="210" y="0" width="30" height="30" fill="#06b6d4"/>
      <rect class="tile" x="240" y="0" width="30" height="30" fill="#0ea5e9"/>
      <rect class="tile" x="270" y="0" width="30" height="30" fill="#2563eb"/>
      <rect class="tile" x="0" y="30" width="30" height="30" fill="#ef4444"/>
      <rect class="tile" x="30" y="30" width="30" height="30" fill="#fb923c"/>
      <rect class="tile" x="60" y="30" width="30" height="30" fill="#f97316"/>
      <rect class="tile" x="90" y="30" width="30" height="30" fill="#facc15"/>
      <rect class="tile" x="120" y="30" width="30" height="30" fill="#bef264"/>
      <rect class="tile" x="150" y="30" width="30" height="30" fill="#4ade80"/>
      <rect class="tile" x="180" y="30" width="30" height="30" fill="#2dd4bf"/>
      <rect class="tile" x="210" y="30" width="30" height="30" fill="#38bdf8"/>
      <rect class="tile" x="240" y="30" width="30" height="30" fill="#60a5fa"/>
      <rect class="tile" x="270" y="30" width="30" height="30" fill="#3b82f6"/>
      <rect class="tile" x="0" y="60" width="30" height="30" fill="#f97316"/>
      <rect class="tile" x="30" y="60" width="30" height="30" fill="#f59e0b"/>
      <rect class="tile" x="60" y="60" width="30" height="30" fill="#eab308"/>
      <rect class="tile" x="90" y="60" width="30" height="30" fill="#84cc16"/>
      <rect class="tile" x="120" y="60" width="30" height="30" fill="#22c55e"/>
      <rect class="tile" x="150" y="60" width="30" height="30" fill="#10b981"/>
      <rect class="tile" x="180" y="60" width="30" height="30" fill="#14b8a6"/>
      <rect class="tile" x="210" y="60" width="30" height="30" fill="#0ea5e9"/>
      <rect class="tile" x="240" y="60" width="30" height="30" fill="#2563eb"/>
      <rect class="tile" x="270" y="60" width="30" height="30" fill="#1d4ed8"/>
      <rect class="tile" x="0" y="90" width="30" height="30" fill="#d946ef"/>
      <rect class="tile" x="30" y="90" width="30" height="30" fill="#ec4899"/>
      <rect class="tile" x="60" y="90" width="30" height="30" fill="#8b5cf6"/>
      <rect class="tile" x="90" y="90" width="30" height="30" fill="#6366f1"/>
      <rect class="tile" x="120" y="90" width="30" height="30" fill="#22d3ee"/>
      <rect class="tile" x="150" y="90" width="30" height="30" fill="#14b8a6"/>
      <rect class="tile" x="180" y="90" width="30" height="30" fill="#38bdf8"/>
      <rect class="tile" x="210" y="90" width="30" height="30" fill="#60a5fa"/>
      <rect class="tile" x="240" y="90" width="30" height="30" fill="#3b82f6"/>
      <rect class="tile" x="270" y="90" width="30" height="30" fill="#1e40af"/>
    </g>
    <g opacity="0.35">
      <path d="M0 220 C90 170 180 250 300 190" stroke="#7c3aed" stroke-width="54" fill="none"/>
      <path d="M0 120 C92 90 200 142 300 104" stroke="#06b6d4" stroke-width="38" fill="none"/>
      <path d="M0 40 C100 65 180 22 300 46" stroke="#f97316" stroke-width="45" fill="none"/>
    </g>
    <text x="150" y="350" text-anchor="middle" class="label">Multiple Colours</text>
    <text x="150" y="374" text-anchor="middle" class="small">many correlated pixel features</text>
  </g>

  <path class="arrow" d="M 435 250 L 530 250"/>

  <g transform="translate(575,105)">
    <rect x="0" y="0" width="300" height="92" fill="#fb923c"/>
    <rect x="0" y="92" width="300" height="94" fill="#78936b"/>
    <rect x="0" y="186" width="300" height="94" fill="#3f5f98"/>
    <rect x="0" y="0" width="300" height="280" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <text x="150" y="330" text-anchor="middle" class="label">Dominant Colours</text>
    <text x="150" y="354" text-anchor="middle" class="small">top components keep most variation</text>
  </g>
</svg>
