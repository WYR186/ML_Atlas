<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">CNN feature extraction and classification pipeline</title>
  <desc id="desc">A convolutional neural network pipeline showing input image, repeated convolution ReLU and pooling feature maps, flattening, fully connected layers, and output class probabilities.</desc>
  <style>
    :root {
      color-scheme: light;
    }
    .bg { fill: #f8fafc; }
    .panel { fill: #ffffff; stroke: #d7dee8; stroke-width: 1.5; }
    .muted-panel { fill: #eef2f7; stroke: #cbd5e1; stroke-width: 1.5; }
    .map { fill: #22a45a; stroke: #12733b; stroke-width: 2; }
    .map-light { fill: #dcfce7; stroke: #4ade80; stroke-width: 1.5; }
    .line { stroke: #1f2937; stroke-width: 1.7; fill: none; }
    .thin { stroke: #475569; stroke-width: 1.1; fill: none; }
    .arrow { stroke: #1f2937; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
    .label { fill: #111827; font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .small { fill: #334155; font: 600 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .tiny { fill: #475569; font: 500 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .vertical { writing-mode: tb; glyph-orientation-vertical: 0; }
    .neuron-blue { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1.5; }
    .neuron-red { fill: #fecaca; stroke: #f87171; stroke-width: 1.5; }
    .bracket { stroke: #475569; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#1f2937"/>
    </marker>
    <linearGradient id="inputGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#e5e7eb"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="fcGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
  </defs>

  <rect class="bg" width="1120" height="520" rx="24"/>
  <rect class="panel" x="34" y="56" width="780" height="360" rx="20"/>
  <rect class="panel" x="840" y="56" width="246" height="360" rx="20"/>

  <text class="label" x="410" y="40" text-anchor="middle">Feature Maps</text>
  <line class="thin" x1="126" y1="49" x2="695" y2="49"/>
  <path class="thin" d="M126 49 l8 -5 M126 49 l8 5 M695 49 l-8 -5 M695 49 l-8 5"/>
  <text class="label" x="963" y="40" text-anchor="middle">Fully Connected Layer</text>
  <path class="bracket" d="M858 53 v-14 q0-7 7-7 h86 l12-18 12 18 h86 q7 0 7 7 v14"/>

  <text class="small" x="70" y="391">Input</text>
  <text class="small" x="62" y="410">image</text>
  <rect x="48" y="190" width="78" height="78" rx="4" fill="url(#inputGrad)" stroke="#94a3b8"/>
  <rect x="78" y="209" width="15" height="15" fill="#f8fafc" stroke="#111827"/>
  <line class="thin" x1="93" y1="216" x2="214" y2="237"/>

  <g id="stack1" transform="translate(165 124)">
    <text class="small" x="42" y="-18" text-anchor="middle">Pooling</text>
    <rect class="map-light" x="0" y="0" width="76" height="76"/>
    <rect class="map" x="9" y="8" width="76" height="76"/>
    <rect class="map-light" x="18" y="16" width="76" height="76"/>
    <rect class="map" x="27" y="24" width="76" height="76"/>
    <rect class="map-light" x="36" y="32" width="76" height="76"/>
    <rect class="map" x="45" y="40" width="76" height="76"/>
    <circle cx="80" cy="80" r="4" fill="#f8fafc"/>
    <rect x="58" y="75" width="18" height="18" fill="none" stroke="#0f172a"/>
  </g>
  <text class="small" x="230" y="306" text-anchor="middle">Convolution +</text>
  <text class="small" x="230" y="325" text-anchor="middle">ReLU</text>

  <g id="stack2" transform="translate(352 139)">
    <text class="small" x="42" y="-18" text-anchor="middle">Pooling</text>
    <rect class="map-light" x="0" y="0" width="64" height="64"/>
    <rect class="map" x="8" y="8" width="64" height="64"/>
    <rect class="map-light" x="16" y="16" width="64" height="64"/>
    <rect class="map" x="24" y="24" width="64" height="64"/>
    <rect class="map-light" x="32" y="32" width="64" height="64"/>
    <rect class="map" x="40" y="40" width="64" height="64"/>
    <circle cx="73" cy="73" r="4" fill="#f8fafc"/>
    <rect x="36" y="38" width="18" height="18" fill="none" stroke="#0f172a"/>
  </g>
  <text class="small" x="424" y="306" text-anchor="middle">Convolution +</text>
  <text class="small" x="424" y="325" text-anchor="middle">ReLU</text>

  <g id="stack3" transform="translate(528 152)">
    <text class="small" x="42" y="-18" text-anchor="middle">Pooling</text>
    <rect class="map-light" x="0" y="0" width="58" height="58"/>
    <rect class="map" x="8" y="8" width="58" height="58"/>
    <rect class="map-light" x="16" y="16" width="58" height="58"/>
    <rect class="map" x="24" y="24" width="58" height="58"/>
    <rect class="map-light" x="32" y="32" width="58" height="58"/>
    <rect class="map" x="40" y="40" width="58" height="58"/>
    <circle cx="68" cy="68" r="4" fill="#f8fafc"/>
    <rect x="73" y="38" width="18" height="18" fill="none" stroke="#0f172a"/>
  </g>
  <text class="small" x="596" y="306" text-anchor="middle">Convolution +</text>
  <text class="small" x="596" y="325" text-anchor="middle">ReLU</text>

  <g id="stack4" transform="translate(702 168)">
    <text class="small" x="42" y="-18" text-anchor="middle">Pooling</text>
    <rect class="map-light" x="0" y="0" width="50" height="50"/>
    <rect class="map" x="7" y="7" width="50" height="50"/>
    <rect class="map-light" x="14" y="14" width="50" height="50"/>
    <rect class="map" x="21" y="21" width="50" height="50"/>
    <rect class="map-light" x="28" y="28" width="50" height="50"/>
    <rect class="map" x="35" y="35" width="50" height="50"/>
    <circle cx="61" cy="61" r="4" fill="#f8fafc"/>
    <rect x="45" y="28" width="18" height="18" fill="none" stroke="#0f172a"/>
  </g>
  <text class="small" x="762" y="306" text-anchor="middle">Convolution +</text>
  <text class="small" x="762" y="325" text-anchor="middle">ReLU</text>

  <path class="thin" d="M276 263 C322 257 323 225 378 216"/>
  <path class="thin" d="M278 261 C350 280 422 249 570 235"/>
  <path class="thin" d="M452 214 C490 217 520 219 588 219"/>
  <path class="thin" d="M626 232 C678 231 707 233 763 229"/>
  <path class="thin" d="M789 229 C824 241 819 258 847 258"/>

  <path class="bracket" d="M48 394 v30 h775 v-30"/>
  <text class="label" x="436" y="453" text-anchor="middle">Feature Extraction</text>

  <rect x="842" y="96" width="52" height="220" fill="url(#fcGrad)" stroke="#fed7aa"/>
  <text class="small vertical" x="866" y="142">Flatten</text>
  <line class="thin" x1="814" y1="220" x2="842" y2="220"/>

  <g transform="translate(930 95)">
    <circle class="neuron-blue" cx="0" cy="0" r="14"/>
    <circle class="neuron-blue" cx="0" cy="54" r="14"/>
    <circle class="neuron-blue" cx="0" cy="108" r="14"/>
    <circle class="neuron-blue" cx="0" cy="162" r="14"/>
    <circle class="neuron-blue" cx="0" cy="216" r="14"/>
    <text class="tiny" x="-4" y="192" text-anchor="middle">...</text>
  </g>
  <g transform="translate(1030 145)">
    <circle class="neuron-red" cx="0" cy="0" r="14"/>
    <circle class="neuron-red" cx="0" cy="54" r="14"/>
    <circle class="neuron-red" cx="0" cy="108" r="14"/>
    <circle class="neuron-red" cx="0" cy="162" r="14"/>
    <text class="small" x="31" y="5">0.3</text>
    <text class="small" x="31" y="59">0.1</text>
    <text class="small" x="31" y="113">0.2</text>
    <text class="small" x="31" y="167">0.9</text>
    <text class="tiny" x="1" y="136" text-anchor="middle">...</text>
  </g>

  <g stroke="#111827" stroke-width="1">
    <line x1="894" y1="205" x2="930" y2="95"/>
    <line x1="894" y1="205" x2="930" y2="149"/>
    <line x1="894" y1="205" x2="930" y2="203"/>
    <line x1="894" y1="205" x2="930" y2="257"/>
    <line x1="894" y1="205" x2="930" y2="311"/>
    <line x1="930" y1="95" x2="1030" y2="145"/>
    <line x1="930" y1="95" x2="1030" y2="199"/>
    <line x1="930" y1="95" x2="1030" y2="253"/>
    <line x1="930" y1="95" x2="1030" y2="307"/>
    <line x1="930" y1="149" x2="1030" y2="145"/>
    <line x1="930" y1="149" x2="1030" y2="199"/>
    <line x1="930" y1="149" x2="1030" y2="253"/>
    <line x1="930" y1="203" x2="1030" y2="145"/>
    <line x1="930" y1="203" x2="1030" y2="199"/>
    <line x1="930" y1="203" x2="1030" y2="253"/>
    <line x1="930" y1="257" x2="1030" y2="199"/>
    <line x1="930" y1="257" x2="1030" y2="253"/>
    <line x1="930" y1="257" x2="1030" y2="307"/>
    <line x1="930" y1="311" x2="1030" y2="253"/>
    <line x1="930" y1="311" x2="1030" y2="307"/>
  </g>

  <path class="bracket" d="M842 394 v30 h244 v-30"/>
  <text class="label" x="965" y="453" text-anchor="middle">Classification</text>

  <text class="tiny" x="54" y="486">Static SVG teaching diagram for ML Atlas. Architecture: input image → convolution + ReLU → pooling → flatten → dense classifier.</text>
</svg>
