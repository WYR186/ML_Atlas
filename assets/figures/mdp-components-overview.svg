<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Markov Decision Process components</title>
  <desc id="desc">A compact MDP component sheet listing states, transition model, actions, reward, and policy.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="760" height="520" rx="24" fill="#f8fafc"/>
  <rect x="60" y="44" width="640" height="420" rx="18" fill="#ffffff" stroke="#d1d5db" filter="url(#shadow)"/>

  <text x="380" y="92" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#111827">Markov Decision Process</text>

  <g font-family="Inter, Arial, sans-serif" font-size="25">
    <text x="120" y="150" font-weight="800" fill="#238c4b">States:</text>
    <text x="285" y="150" font-weight="700" fill="#111827">S</text>

    <text x="120" y="210" font-weight="800" fill="#238c4b">Model:</text>
    <text x="285" y="210" font-weight="700" fill="#111827">T(s, a, s') ~ P(s' | s, a)</text>

    <text x="120" y="270" font-weight="800" fill="#238c4b">Actions:</text>
    <text x="285" y="270" font-weight="700" fill="#111827">A(s), A</text>

    <text x="120" y="330" font-weight="800" fill="#238c4b">Reward:</text>
    <text x="285" y="330" font-weight="700" fill="#111827">R(s), R(s, a), R(s, a, s')</text>
  </g>

  <line x1="90" y1="372" x2="670" y2="372" stroke="#111827" stroke-width="3"/>

  <g font-family="Inter, Arial, sans-serif" font-size="25">
    <text x="120" y="432" font-weight="800" fill="#238c4b">Policy:</text>
    <text x="285" y="432" font-weight="700" fill="#111827">pi(s) -> a</text>
    <text x="285" y="476" font-weight="700" fill="#111827">pi*</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#64748b">
    <text x="445" y="476">optimal policy: best action rule for long-term return</text>
  </g>
</svg>
