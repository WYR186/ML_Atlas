<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Diffusion model forward and reverse process</title>
  <desc id="desc">A diffusion model diagram showing clean training image, diffusion model, generated image, forward diffusion that adds noise, and reverse diffusion that denoises back to a clean sample.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.6; }
    .model { fill: #168a43; stroke: #0f6b34; stroke-width: 2; }
    .label { fill: #111827; font: 800 26px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .small { fill: #111827; font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .tiny { fill: #334155; font: 600 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .arrow { stroke: #111827; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    .arrow-back { stroke: #111827; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    .dash { stroke: #111827; stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
    .zoom { stroke: #111827; stroke-width: 2; fill: none; }
    .cat { fill: #f59e0b; stroke: #92400e; stroke-width: 1.8; }
    .cat-soft { fill: #fbbf24; opacity: .65; }
    .noise1 { fill: url(#noiseLow); }
    .noise2 { fill: url(#noiseMid); }
    .noise3 { fill: url(#noiseHigh); }
    .noise4 { fill: url(#noiseVeryHigh); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#111827"/>
    </marker>
    <pattern id="noiseLow" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#f8fafc"/>
      <circle cx="2" cy="3" r="1.1" fill="#94a3b8"/>
      <circle cx="8" cy="5" r="1" fill="#cbd5e1"/>
      <circle cx="5" cy="10" r=".9" fill="#64748b"/>
    </pattern>
    <pattern id="noiseMid" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#f1f5f9"/>
      <circle cx="1" cy="2" r="1.2" fill="#475569"/>
      <circle cx="7" cy="3" r="1" fill="#94a3b8"/>
      <circle cx="5" cy="7" r="1.3" fill="#64748b"/>
      <circle cx="9" cy="9" r=".8" fill="#cbd5e1"/>
    </pattern>
    <pattern id="noiseHigh" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#e2e8f0"/>
      <rect x="0" y="0" width="2" height="2" fill="#0f172a"/>
      <rect x="4" y="1" width="2" height="2" fill="#94a3b8"/>
      <rect x="2" y="5" width="3" height="2" fill="#475569"/>
      <rect x="6" y="6" width="2" height="2" fill="#cbd5e1"/>
    </pattern>
    <pattern id="noiseVeryHigh" width="7" height="7" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#f8fafc"/>
      <rect x="0" y="0" width="2" height="2" fill="#111827"/>
      <rect x="3" y="0" width="2" height="2" fill="#64748b"/>
      <rect x="5" y="3" width="2" height="2" fill="#334155"/>
      <rect x="1" y="4" width="3" height="2" fill="#94a3b8"/>
    </pattern>
  </defs>

  <rect class="bg" width="1120" height="520" rx="24"/>

  <text class="label" x="176" y="44" text-anchor="middle">Training Data / Image</text>
  <text class="label" x="891" y="44" text-anchor="middle">Generated Data / New Image</text>
  <rect class="panel" x="116" y="62" width="126" height="126"/>
  <rect class="panel" x="824" y="62" width="126" height="126"/>

  <g transform="translate(142 86) scale(1.05)">
    <path class="cat-soft" d="M34 18 L21 1 L20 28 Z"/>
    <path class="cat-soft" d="M56 18 L70 1 L69 28 Z"/>
    <ellipse class="cat" cx="45" cy="54" rx="28" ry="36"/>
    <circle class="cat" cx="45" cy="30" r="23"/>
    <path d="M35 28 q5 5 10 0 q5 5 10 0" fill="none" stroke="#78350f" stroke-width="2"/>
    <circle cx="37" cy="25" r="3" fill="#111827"/>
    <circle cx="53" cy="25" r="3" fill="#111827"/>
    <path d="M45 32 l-4 6 h8 z" fill="#ef4444"/>
    <path class="cat" d="M68 64 q24 0 22 24 q-14 -8 -29 -7"/>
  </g>
  <g transform="translate(850 86) scale(1.05)">
    <path class="cat-soft" d="M34 18 L21 1 L20 28 Z"/>
    <path class="cat-soft" d="M56 18 L70 1 L69 28 Z"/>
    <ellipse class="cat" cx="45" cy="54" rx="28" ry="36"/>
    <circle class="cat" cx="45" cy="30" r="23"/>
    <path d="M35 28 q5 5 10 0 q5 5 10 0" fill="none" stroke="#78350f" stroke-width="2"/>
    <circle cx="37" cy="25" r="3" fill="#111827"/>
    <circle cx="53" cy="25" r="3" fill="#111827"/>
    <path d="M45 32 l-4 6 h8 z" fill="#ef4444"/>
    <path class="cat" d="M68 64 q24 0 22 24 q-14 -8 -29 -7"/>
  </g>

  <path class="arrow" d="M256 125 H397"/>
  <rect class="model" x="418" y="52" width="190" height="144" rx="12"/>
  <text x="513" y="110" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="800" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Diffusion</text>
  <text x="513" y="146" text-anchor="middle" fill="#ffffff" font-size="31" font-weight="800" font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Model</text>
  <path class="dash" d="M404 36 H622 V214 H404 Z"/>
  <path class="arrow" d="M638 125 H805"/>

  <path class="zoom" d="M408 214 L144 256 V440"/>
  <path class="zoom" d="M622 214 L960 256 V440"/>
  <path class="zoom" d="M144 256 H960"/>

  <text class="label" x="552" y="288" text-anchor="middle" font-size="24">Forward Diffusion</text>
  <path class="arrow" d="M168 302 H866"/>

  <g transform="translate(160 328)">
    <rect class="panel" x="0" y="0" width="120" height="96"/>
    <g transform="translate(24 12) scale(.75)">
      <path class="cat-soft" d="M34 18 L21 1 L20 28 Z"/>
      <path class="cat-soft" d="M56 18 L70 1 L69 28 Z"/>
      <ellipse class="cat" cx="45" cy="54" rx="28" ry="36"/>
      <circle class="cat" cx="45" cy="30" r="23"/>
      <circle cx="37" cy="25" r="3" fill="#111827"/>
      <circle cx="53" cy="25" r="3" fill="#111827"/>
      <path d="M45 32 l-4 6 h8 z" fill="#ef4444"/>
      <path class="cat" d="M68 64 q24 0 22 24 q-14 -8 -29 -7"/>
    </g>
    <text class="tiny" x="60" y="116" text-anchor="middle">x0 clean</text>
  </g>

  <g transform="translate(360 328)">
    <rect class="panel noise1" x="0" y="0" width="120" height="96"/>
    <g transform="translate(24 12) scale(.75)" opacity=".82">
      <ellipse class="cat" cx="45" cy="54" rx="28" ry="36"/>
      <circle class="cat" cx="45" cy="30" r="23"/>
      <circle cx="37" cy="25" r="3" fill="#111827"/>
      <circle cx="53" cy="25" r="3" fill="#111827"/>
      <path class="cat" d="M68 64 q24 0 22 24 q-14 -8 -29 -7"/>
    </g>
    <text class="tiny" x="60" y="116" text-anchor="middle">x1 light noise</text>
  </g>

  <g transform="translate(560 328)">
    <rect class="panel noise2" x="0" y="0" width="120" height="96"/>
    <g transform="translate(24 12) scale(.75)" opacity=".55">
      <ellipse class="cat" cx="45" cy="54" rx="28" ry="36"/>
      <circle class="cat" cx="45" cy="30" r="23"/>
      <path class="cat" d="M68 64 q24 0 22 24 q-14 -8 -29 -7"/>
    </g>
    <text class="tiny" x="60" y="116" text-anchor="middle">xt more noise</text>
  </g>

  <g transform="translate(760 328)">
    <rect class="panel noise4" x="0" y="0" width="120" height="96"/>
    <g transform="translate(24 12) scale(.75)" opacity=".26">
      <ellipse class="cat" cx="45" cy="54" rx="28" ry="36"/>
      <circle class="cat" cx="45" cy="30" r="23"/>
      <path class="cat" d="M68 64 q24 0 22 24 q-14 -8 -29 -7"/>
    </g>
    <text class="small" x="60" y="116" text-anchor="middle">Noisy Image</text>
  </g>

  <path class="arrow-back" d="M875 462 H168"/>
  <text class="label" x="552" y="493" text-anchor="middle" font-size="24">Reverse Diffusion</text>
  <text class="tiny" x="552" y="506" text-anchor="middle">Training learns the reverse denoising steps; generation starts at noise and walks back to x0.</text>
</svg>
