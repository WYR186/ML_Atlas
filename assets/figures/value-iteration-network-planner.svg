<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Value iteration network planning module</title>
  <desc id="desc">A value iteration style planning module takes reward and transition models, repeatedly plans on an MDP, produces a value map, attends to the current state representation, and passes the result to a reactive policy.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 32px; font-weight: 800; fill: #111827; }
      .label { font-size: 17px; font-weight: 800; fill: #111827; }
      .small { font-size: 14px; fill: #475569; }
      .tiny { font-size: 13px; fill: #475569; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .dash { fill: #ffffff; stroke: #334155; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .module { fill: #dcfce7; stroke: #166534; stroke-width: 1.8; }
      .green { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="960" height="520" rx="18" fill="#f8fafc"/>
  <text x="480" y="48" text-anchor="middle" class="title">Value Iteration Network / VI Module</text>
  <text x="480" y="76" text-anchor="middle" class="small">Read this as a visual version of repeated Bellman planning with a known or learned model.</text>

  <rect x="54" y="214" width="174" height="96" rx="10" class="box"/>
  <rect x="78" y="242" width="126" height="40" rx="4" class="dash"/>
  <text x="141" y="268" text-anchor="middle" class="label">phi(s)</text>
  <text x="141" y="332" text-anchor="middle" class="tiny">state features</text>

  <rect x="312" y="112" width="396" height="160" rx="8" class="module"/>
  <text x="510" y="140" text-anchor="middle" class="label">VI module</text>

  <rect x="338" y="154" width="74" height="82" rx="4" class="dash"/>
  <text x="375" y="186" text-anchor="middle" class="label">R</text>
  <text x="375" y="216" text-anchor="middle" class="label">P</text>
  <text x="375" y="252" text-anchor="middle" class="tiny">model</text>

  <rect x="462" y="154" width="142" height="82" rx="6" class="box"/>
  <text x="533" y="187" text-anchor="middle" class="label">Plan on</text>
  <text x="533" y="211" text-anchor="middle" class="label">MDP</text>
  <text x="533" y="252" text-anchor="middle" class="tiny">Bellman backups</text>

  <rect x="642" y="154" width="52" height="82" rx="4" class="dash"/>
  <text x="668" y="198" text-anchor="middle" class="label">V</text>
  <text x="668" y="252" text-anchor="middle" class="tiny">values</text>

  <rect x="388" y="326" width="154" height="72" rx="8" class="box"/>
  <text x="465" y="369" text-anchor="middle" class="label">Attention</text>
  <text x="465" y="421" text-anchor="middle" class="tiny">select useful values</text>

  <rect x="413" y="432" width="104" height="42" rx="4" class="dash"/>
  <text x="465" y="459" text-anchor="middle" class="label">psi(s)</text>

  <rect x="626" y="392" width="274" height="82" rx="8" class="box"/>
  <text x="763" y="426" text-anchor="middle" class="label">Reactive policy</text>
  <text x="763" y="454" text-anchor="middle" class="small">pi(a | phi(s), psi(s))</text>

  <g stroke="#111827" stroke-width="2.3" fill="none" marker-end="url(#arrow)">
    <line x1="228" y1="262" x2="388" y2="262"/>
    <line x1="246" y1="180" x2="338" y2="180"/>
    <line x1="246" y1="210" x2="338" y2="210"/>
    <line x1="412" y1="195" x2="462" y2="195"/>
    <line x1="604" y1="195" x2="642" y2="195"/>
    <path d="M694 195 H750 V326 H542"/>
    <line x1="465" y1="398" x2="465" y2="432"/>
    <line x1="517" y1="453" x2="626" y2="453"/>
    <path d="M141 310 V486 H626"/>
  </g>

  <text x="270" y="174" text-anchor="middle" class="tiny">reward features</text>
  <text x="270" y="205" text-anchor="middle" class="tiny">transition features</text>
  <text x="482" y="300" text-anchor="middle" class="small">VI repeatedly updates values; attention reads the state-relevant part.</text>
</svg>
