<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Working of a decision tree</title>
  <desc id="desc">A decision tree takes input features, asks split questions such as age less than 15 and is male, then reaches leaf nodes that store prediction scores.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#22c55e"/>
    </marker>
    <style>
      .label { font-family: Inter, Arial, sans-serif; fill: #111827; }
      .muted { fill: #4b5563; }
      .panel { fill: #ffffff; stroke: #d7dde8; stroke-width: 1.5; }
      .node { fill: #dcfce7; stroke: #9bd6ae; stroke-width: 1.4; }
      .leaf { fill: #ffffff; stroke: #111827; stroke-width: 2.2; }
      .edge { stroke: #111827; stroke-width: 2.2; fill: none; }
      .avatar-skin { fill: #f2b587; }
      .avatar-hair { fill: #1f2937; }
    </style>
  </defs>

  <rect width="960" height="540" rx="0" fill="#f8fafc"/>

  <g filter="url(#shadow)">
    <rect x="248" y="18" width="464" height="58" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
  </g>
  <text class="label" x="480" y="56" text-anchor="middle" font-size="31" font-weight="850">Working of a Decision Tree</text>
  <text class="label muted" x="480" y="104" text-anchor="middle" font-size="20">
    The model routes one example through simple split questions until a leaf returns a score.
  </text>

  <g filter="url(#shadow)">
    <rect class="panel" x="62" y="128" width="280" height="350" rx="16"/>
  </g>
  <text class="label" x="202" y="164" text-anchor="middle" font-size="20" font-weight="800">Input features</text>
  <text class="label muted" x="202" y="191" text-anchor="middle" font-size="17">Age · Gender · Occupation</text>

  <g transform="translate(102 220)">
    <circle class="avatar-skin" cx="42" cy="28" r="19"/>
    <path class="avatar-hair" d="M24 23c6-20 31-21 38-3 0 0-7-7-18-6-12 1-20 9-20 9Z"/>
    <rect x="17" y="48" width="50" height="52" rx="12" fill="#f59e0b"/>
    <path d="M42 51l12 19H30Z" fill="#fed7aa"/>
  </g>
  <g transform="translate(202 220)">
    <circle class="avatar-skin" cx="42" cy="28" r="19"/>
    <path d="M23 29c5-21 35-22 40 0-12-6-27-6-40 0Z" fill="#d1d5db"/>
    <rect x="16" y="48" width="52" height="52" rx="12" fill="#64748b"/>
    <path d="M42 50l9 19h-18Z" fill="#fee2e2"/>
  </g>
  <g transform="translate(98 315)">
    <circle class="avatar-skin" cx="42" cy="28" r="19"/>
    <path class="avatar-hair" d="M20 48c3-35 40-35 44 0-13-11-30-11-44 0Z"/>
    <rect x="16" y="48" width="52" height="52" rx="12" fill="#ec4899"/>
    <path d="M42 51l10 18H32Z" fill="#fce7f3"/>
  </g>
  <g transform="translate(206 315)">
    <circle cx="42" cy="28" r="19" fill="#9f6a4f"/>
    <path class="avatar-hair" d="M22 31c4-22 35-22 40 0-13-8-28-8-40 0Z"/>
    <rect x="16" y="48" width="52" height="52" rx="12" fill="#047857"/>
    <path d="M42 50l11 18H31Z" fill="#dcfce7"/>
  </g>
  <text class="label muted" x="202" y="445" text-anchor="middle" font-size="17">Each row is routed to one leaf.</text>

  <path d="M374 303 H452" stroke="#22c55e" stroke-width="34" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect class="panel" x="496" y="128" width="402" height="350" rx="16"/>
  </g>
  <text class="label" x="697" y="164" text-anchor="middle" font-size="20" font-weight="800">Does this person like games?</text>

  <g>
    <rect class="node" x="623" y="202" width="148" height="42" rx="23"/>
    <text class="label" x="697" y="230" text-anchor="middle" font-size="20" font-weight="800">Age &lt; 15?</text>

    <path class="edge" d="M680 243 L606 296"/>
    <path class="edge" d="M714 243 L797 296"/>
    <text class="label" x="610" y="278" text-anchor="middle" font-size="17" font-weight="800">No</text>
    <text class="label" x="774" y="278" text-anchor="middle" font-size="17" font-weight="800">Yes</text>

    <rect class="node" x="532" y="296" width="144" height="42" rx="23"/>
    <text class="label" x="604" y="324" text-anchor="middle" font-size="20" font-weight="800">Is male?</text>

    <path class="edge" d="M585 338 L544 389"/>
    <path class="edge" d="M626 338 L682 389"/>
    <text class="label" x="562" y="373" text-anchor="middle" font-size="17" font-weight="800">Yes</text>
    <text class="label" x="656" y="373" text-anchor="middle" font-size="17" font-weight="800">No</text>

    <circle class="leaf" cx="522" cy="414" r="40"/>
    <circle cx="522" cy="402" r="13" fill="#9f6a4f"/>
    <path class="avatar-hair" d="M507 405c3-16 26-16 30 0-9-6-20-6-30 0Z"/>
    <rect x="505" y="416" width="34" height="24" rx="7" fill="#047857"/>
    <text class="label" x="522" y="473" text-anchor="middle" font-size="20" font-weight="850">+2</text>

    <circle class="leaf" cx="704" cy="414" r="40"/>
    <circle class="avatar-skin" cx="704" cy="402" r="13"/>
    <path class="avatar-hair" d="M689 421c2-25 28-25 31 0-9-8-22-8-31 0Z"/>
    <rect x="687" y="416" width="34" height="24" rx="7" fill="#ec4899"/>
    <text class="label" x="704" y="473" text-anchor="middle" font-size="20" font-weight="850">+0.1</text>

    <circle class="leaf" cx="812" cy="332" r="48"/>
    <g transform="translate(780 296) scale(.62)">
      <circle class="avatar-skin" cx="42" cy="28" r="19"/>
      <path class="avatar-hair" d="M24 23c6-20 31-21 38-3 0 0-7-7-18-6-12 1-20 9-20 9Z"/>
      <rect x="17" y="48" width="50" height="52" rx="12" fill="#f59e0b"/>
    </g>
    <g transform="translate(814 296) scale(.62)">
      <circle class="avatar-skin" cx="42" cy="28" r="19"/>
      <path d="M23 29c5-21 35-22 40 0-12-6-27-6-40 0Z" fill="#d1d5db"/>
      <rect x="16" y="48" width="52" height="52" rx="12" fill="#64748b"/>
    </g>
    <text class="label" x="812" y="414" text-anchor="middle" font-size="20" font-weight="850">-1</text>
  </g>

  <text class="label muted" x="697" y="510" text-anchor="middle" font-size="17">
    Internal nodes ask questions; leaves store final prediction scores.
  </text>
</svg>
