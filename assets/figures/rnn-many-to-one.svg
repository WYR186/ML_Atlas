<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 460" role="img" aria-labelledby="title desc">
  <title id="title">Many-to-one recurrent network pattern</title>
  <desc id="desc">Multiple inputs are read over time, and a single output is produced from the final hidden state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#111827"/>
    </marker>
    <style>
      .title{font:800 26px Arial,sans-serif;fill:#111827}
      .label{font:700 20px Arial,sans-serif;fill:#111827}
      .box{fill:none;stroke:#111827;stroke-width:1.5}
      .input{fill:#006b2f;stroke:#111827;stroke-width:1.3}
      .state{fill:#22954b;stroke:#111827;stroke-width:1.3}
      .output{fill:#dff4d7;stroke:#111827;stroke-width:1.3}
      .arrow{stroke:#111827;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="430" height="460" fill="#f8fafc"/>
  <text x="315" y="36" text-anchor="middle" class="title">Many to One</text>
  <text x="92" y="106" text-anchor="middle" class="label">Single Output</text>
  <text x="103" y="382" text-anchor="middle" class="label">Multiple Inputs</text>
  <rect class="box" x="195" y="56" width="200" height="360" rx="8"/>
  <rect class="output" x="346" y="87" width="35" height="92" rx="6"/>
  <rect class="state" x="225" y="218" width="42" height="92" rx="6"/>
  <rect class="state" x="292" y="218" width="42" height="92" rx="6"/>
  <rect class="state" x="359" y="218" width="42" height="92" rx="6"/>
  <rect class="input" x="225" y="337" width="42" height="92" rx="6"/>
  <rect class="input" x="292" y="337" width="42" height="92" rx="6"/>
  <rect class="input" x="359" y="337" width="42" height="92" rx="6"/>
  <path class="arrow" d="M246 337V313"/>
  <path class="arrow" d="M313 337V313"/>
  <path class="arrow" d="M380 337V313"/>
  <path class="arrow" d="M267 264H290"/>
  <path class="arrow" d="M334 264H357"/>
  <path class="arrow" d="M380 218V182"/>
</svg>
