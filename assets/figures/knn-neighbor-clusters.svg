<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" role="img" aria-labelledby="title desc">
  <title id="title">KNN neighbor clusters around a query point</title>
  <desc id="desc">A KNN teaching diagram with three labeled regions, a query point, arrows to nearby training samples, and axes showing that KNN predicts from nearest labeled examples.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#111827"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>
  <style>
    .bg { fill: #f8faf8; }
    .axis { stroke: #111827; stroke-width: 4; marker-end: url(#arrow); }
    .region { fill: #d9f0d5; stroke: #20834d; stroke-width: 2.5; stroke-dasharray: 6 7; }
    .pt { fill: #208f57; stroke: #ffffff; stroke-width: 2; }
    .diamond { fill: #26a269; stroke: #ffffff; stroke-width: 2; }
    .query { fill: #ffffff; stroke: #111827; stroke-width: 3; }
    .queryText { font: 800 31px Arial, sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
    .arrow { stroke: #111827; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .label { font: 800 22px Arial, sans-serif; fill: #111827; }
    .small { font: 600 15px Arial, sans-serif; fill: #334155; }
    .note { fill: #ffffff; stroke: #cfdad4; stroke-width: 1.4; }
    .noteTitle { font: 800 17px Arial, sans-serif; fill: #14532d; }
    .noteText { font: 600 14px Arial, sans-serif; fill: #334155; }
  </style>

  <rect class="bg" width="920" height="640"/>
  <text x="460" y="58" text-anchor="middle" style="font:900 42px Arial,sans-serif;fill:#0f172a;">K Nearest Neighbors</text>
  <text x="460" y="90" text-anchor="middle" class="small">The query looks at nearby labeled samples; the majority label wins.</text>

  <line x1="72" y1="565" x2="845" y2="565" class="axis"/>
  <line x1="72" y1="565" x2="72" y2="118" class="axis"/>
  <text x="842" y="602" class="label">x1</text>
  <text x="28" y="126" class="label">x2</text>

  <path class="region" d="M132 255C105 260 95 292 98 342C103 409 172 425 253 405C327 387 384 407 442 373C485 348 454 292 405 292C338 292 316 248 257 257C203 265 175 247 132 255Z" filter="url(#shadow)"/>
  <path class="region" d="M340 422C393 395 435 391 472 422C515 458 545 475 587 450C622 430 634 473 611 513C581 567 494 548 433 575C377 599 303 575 288 520C276 477 295 444 340 422Z" filter="url(#shadow)"/>
  <path class="region" d="M662 168C668 122 715 104 770 120C817 134 797 190 824 232C850 272 902 278 883 338C866 391 814 347 771 374C731 400 675 365 681 308C686 259 649 220 662 168Z" filter="url(#shadow)"/>

  <circle class="pt" cx="125" cy="327" r="12"/>
  <circle class="pt" cx="170" cy="315" r="12"/>
  <circle class="pt" cx="164" cy="265" r="12"/>
  <circle class="pt" cx="215" cy="251" r="12"/>
  <circle class="pt" cx="247" cy="287" r="12"/>
  <circle class="pt" cx="280" cy="220" r="12"/>
  <circle class="pt" cx="327" cy="301" r="12"/>
  <circle class="pt" cx="395" cy="219" r="12"/>
  <circle class="pt" cx="394" cy="302" r="12"/>

  <rect class="diamond" x="366" y="437" width="25" height="25" transform="rotate(45 378.5 449.5)"/>
  <rect class="diamond" x="424" y="416" width="25" height="25" transform="rotate(45 436.5 428.5)"/>
  <rect class="diamond" x="477" y="413" width="25" height="25" transform="rotate(45 489.5 425.5)"/>
  <rect class="diamond" x="523" y="442" width="25" height="25" transform="rotate(45 535.5 454.5)"/>
  <rect class="diamond" x="328" y="492" width="25" height="25" transform="rotate(45 340.5 504.5)"/>
  <rect class="diamond" x="420" y="501" width="25" height="25" transform="rotate(45 432.5 513.5)"/>
  <rect class="diamond" x="502" y="500" width="25" height="25" transform="rotate(45 514.5 512.5)"/>

  <rect class="pt" x="718" y="152" width="22" height="22"/>
  <rect class="pt" x="754" y="126" width="22" height="22"/>
  <rect class="pt" x="764" y="178" width="22" height="22"/>
  <rect class="pt" x="724" y="244" width="22" height="22"/>
  <rect class="pt" x="770" y="281" width="22" height="22"/>
  <rect class="pt" x="824" y="270" width="22" height="22"/>
  <rect class="pt" x="730" y="306" width="22" height="22"/>

  <circle class="query" cx="535" cy="330" r="29"/>
  <text class="queryText" x="535" y="333">P</text>
  <text x="559" y="348" class="label" style="font-size:20px;">t</text>
  <text x="505" y="374" class="small">query point</text>

  <path class="arrow" d="M515 315L410 300"/>
  <path class="arrow" d="M517 331L395 302"/>
  <path class="arrow" d="M526 358L535 443"/>
  <path class="arrow" d="M561 312L710 251"/>
  <path class="arrow" d="M568 332L723 310"/>
  <path class="arrow" d="M565 350L771 284"/>

  <rect x="96" y="104" width="222" height="82" rx="12" class="note"/>
  <text x="114" y="132" class="noteTitle">What KNN does</text>
  <text x="114" y="156" class="noteText">1. compute distances to all samples</text>
  <text x="114" y="178" class="noteText">2. keep the nearest k labels</text>

  <rect x="585" y="468" width="238" height="92" rx="12" class="note"/>
  <text x="603" y="497" class="noteTitle">Decision intuition</text>
  <text x="603" y="521" class="noteText">Small k follows local detail.</text>
  <text x="603" y="543" class="noteText">Large k smooths the boundary.</text>
</svg>
