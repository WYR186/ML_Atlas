<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Resulting Naive Bayes class conditional data distribution</title>
  <desc id="desc">The separate feature likelihoods are multiplied under the conditional independence assumption to form one class conditional distribution for each class.</desc>
  <defs>
    <marker id="axisArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="800" height="420" rx="22" fill="#f8fafc"/>
  <text x="400" y="58" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#111827">Resulting data distribution</text>

  <g stroke="#111827" stroke-width="2" stroke-dasharray="4 5" fill="none" marker-end="url(#axisArrow)">
    <path d="M 34 238 H 718"/>
    <path d="M 386 362 V 94"/>
  </g>

  <g filter="url(#softShadow)">
    <path d="M 228 203 C 265 170 342 175 348 221 C 352 252 310 251 298 268 C 286 284 333 304 304 329 C 274 356 201 338 226 291 C 239 266 202 253 219 226 C 221 217 223 209 228 203 Z" fill="#dff3d7" stroke="#111827" stroke-width="1.2"/>
    <path d="M 418 140 C 452 121 503 137 507 178 C 510 209 481 211 480 237 C 478 257 507 269 493 291 C 462 290 421 268 421 234 C 421 211 404 198 407 175 C 409 160 412 149 418 140 Z" fill="#fee2e2" stroke="#111827" stroke-width="1.2"/>
  </g>

  <g stroke="#ffffff" stroke-width="3" filter="url(#softShadow)">
    <circle cx="262" cy="219" r="8" fill="#238b45"/>
    <circle cx="296" cy="216" r="8" fill="#238b45"/>
    <circle cx="280" cy="267" r="8" fill="#238b45"/>
    <circle cx="260" cy="310" r="8" fill="#238b45"/>
    <circle cx="298" cy="306" r="8" fill="#238b45"/>
    <circle cx="241" cy="279" r="8" fill="#238b45"/>

    <rect x="421" y="156" width="18" height="18" rx="2" fill="#bf1a0a"/>
    <rect x="451" y="171" width="18" height="18" rx="2" fill="#bf1a0a"/>
    <rect x="468" y="142" width="18" height="18" rx="2" fill="#bf1a0a"/>
    <rect x="422" y="230" width="18" height="18" rx="2" fill="#bf1a0a"/>
    <rect x="454" y="221" width="18" height="18" rx="2" fill="#bf1a0a"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" fill="#111827">
    <text x="205" y="354" font-size="25" font-weight="800">Π<tspan baseline-shift="sub" font-size="15">j</tspan> P(x<tspan baseline-shift="sub" font-size="15">j</tspan>|y = 1)</text>
    <text x="426" y="102" font-size="25" font-weight="800">Π<tspan baseline-shift="sub" font-size="15">j</tspan> P(x<tspan baseline-shift="sub" font-size="15">j</tspan>|y = 2)</text>
    <text x="704" y="262" font-size="14" fill="#64748b">x<tspan baseline-shift="sub" font-size="10">1</tspan></text>
    <text x="356" y="104" font-size="14" fill="#64748b">x<tspan baseline-shift="sub" font-size="10">2</tspan></text>
  </g>
</svg>
