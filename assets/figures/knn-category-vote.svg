<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 620" role="img" aria-labelledby="title desc">
  <title id="title">KNN category vote for a new data point</title>
  <desc id="desc">A KNN diagram showing two categories, a new data point, circled nearest neighbors, and a majority vote that classifies the query as Category B.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#111827"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>
  <style>
    .bg { fill: #f8faf8; }
    .axis { stroke: #111827; stroke-width: 4; marker-end: url(#arrow); }
    .a { fill: #ff6878; stroke: #ffffff; stroke-width: 2; }
    .b { fill: #229456; stroke: #ffffff; stroke-width: 2; }
    .new { fill: #ffffff; stroke: #111827; stroke-width: 3; }
    .ringA { fill: none; stroke: #ef8f9c; stroke-width: 2; }
    .ringB { fill: none; stroke: #208f57; stroke-width: 2; }
    .vote { fill: #ffffff; stroke: #d6ded8; stroke-width: 1.5; }
    .label { font: 800 22px Arial, sans-serif; fill: #111827; }
    .small { font: 600 15px Arial, sans-serif; fill: #334155; }
    .big { font: 900 31px Arial, sans-serif; fill: #111827; }
    .line { stroke: #208f57; stroke-width: 3; marker-end: url(#arrow); }
  </style>

  <rect class="bg" width="860" height="620"/>
  <text x="430" y="58" text-anchor="middle" class="big">KNN: Vote Among the Nearest Labels</text>
  <text x="430" y="87" text-anchor="middle" class="small">For classification, the new point receives the majority class among its k closest samples.</text>

  <line x1="72" y1="552" x2="780" y2="552" class="axis"/>
  <line x1="72" y1="552" x2="72" y2="112" class="axis"/>
  <text x="787" y="552" class="label">x1</text>
  <text x="50" y="104" class="label">x2</text>

  <rect class="a" x="151" y="321" width="34" height="34" transform="rotate(45 168 338)"/>
  <rect class="a" x="212" y="300" width="42" height="42" transform="rotate(45 233 321)"/>
  <rect class="a" x="288" y="314" width="42" height="42" transform="rotate(45 309 335)"/>
  <rect class="a" x="211" y="383" width="34" height="34" transform="rotate(45 228 400)"/>
  <rect class="a" x="278" y="408" width="40" height="40" transform="rotate(45 298 428)"/>
  <rect class="a" x="188" y="428" width="30" height="30" transform="rotate(45 203 443)"/>
  <circle class="ringA" cx="233" cy="321" r="40"/>
  <circle class="ringA" cx="309" cy="335" r="40"/>
  <text x="210" y="475" class="label">Category A</text>

  <rect class="b" x="474" y="161" width="42" height="42" transform="rotate(45 495 182)"/>
  <rect class="b" x="540" y="205" width="42" height="42" transform="rotate(45 561 226)"/>
  <rect class="b" x="418" y="232" width="42" height="42" transform="rotate(45 439 253)"/>
  <rect class="b" x="520" y="268" width="42" height="42" transform="rotate(45 541 289)"/>
  <rect class="b" x="600" y="278" width="42" height="42" transform="rotate(45 621 299)"/>
  <rect class="b" x="491" y="328" width="42" height="42" transform="rotate(45 512 349)"/>
  <rect class="b" x="645" y="221" width="42" height="42" transform="rotate(45 666 242)"/>
  <circle class="ringB" cx="439" cy="253" r="39"/>
  <circle class="ringB" cx="541" cy="289" r="39"/>
  <circle class="ringB" cx="512" cy="349" r="39"/>
  <text x="570" y="358" class="label">Category B</text>

  <circle class="new" cx="382" cy="326" r="20"/>
  <text x="405" y="387" class="label">New data point</text>
  <line x1="395" y1="343" x2="523" y2="393" class="line"/>

  <path d="M382 326L439 253" stroke="#208f57" stroke-width="2.5" fill="none" stroke-dasharray="6 6"/>
  <path d="M382 326L541 289" stroke="#208f57" stroke-width="2.5" fill="none" stroke-dasharray="6 6"/>
  <path d="M382 326L512 349" stroke="#208f57" stroke-width="2.5" fill="none" stroke-dasharray="6 6"/>
  <path d="M382 326L309 335" stroke="#ef8f9c" stroke-width="2.5" fill="none" stroke-dasharray="6 6"/>
  <path d="M382 326L233 321" stroke="#ef8f9c" stroke-width="2.5" fill="none" stroke-dasharray="6 6"/>

  <rect x="546" y="410" width="236" height="110" rx="14" class="vote" filter="url(#shadow)"/>
  <text x="566" y="441" class="label" style="font-size:20px;">Example with k = 5</text>
  <text x="566" y="470" class="small">3 nearest neighbors are B</text>
  <text x="566" y="493" class="small">2 nearest neighbors are A</text>
  <text x="566" y="516" class="small">prediction: Category B</text>
</svg>
