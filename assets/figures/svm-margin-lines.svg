<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="title desc">
  <title id="title">SVM margin lines and support vectors</title>
  <desc id="desc">Two classes separated by three parallel lines: the middle decision boundary and two margin boundaries touching support vectors.</desc>
  <rect width="800" height="400" fill="#f8fafc"/>
  <defs>
    <marker id="axisArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="thinArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111827"/>
    </marker>
  </defs>

  <line x1="52" y1="360" x2="742" y2="360" stroke="#111827" stroke-width="3" marker-end="url(#axisArrow)"/>
  <line x1="52" y1="360" x2="52" y2="30" stroke="#111827" stroke-width="3" marker-end="url(#axisArrow)"/>
  <text x="708" y="350" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">X1</text>
  <text x="64" y="66" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">X2</text>

  <g fill="#a7e7ef" stroke="#238696" stroke-width="1.1">
    <circle cx="145" cy="78" r="22"/>
    <circle cx="175" cy="158" r="22"/>
    <circle cx="248" cy="50" r="22"/>
    <circle cx="305" cy="136" r="22"/>
    <circle cx="352" cy="58" r="22"/>
  </g>
  <g fill="#fee2e2" stroke="#c24141" stroke-width="1.1">
    <circle cx="352" cy="280" r="22"/>
    <circle cx="423" cy="323" r="22"/>
    <circle cx="450" cy="242" r="22"/>
    <circle cx="552" cy="311" r="22"/>
    <circle cx="638" cy="195" r="22"/>
  </g>

  <g stroke="#2f8f4f" stroke-width="3">
    <line x1="128" y1="270" x2="590" y2="54"/>
    <line x1="100" y1="314" x2="640" y2="66"/>
    <line x1="154" y1="325" x2="615" y2="111"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#111827">
    <text x="594" y="56">L1</text>
    <text x="644" y="67">L2</text>
    <text x="622" y="111">L3</text>
  </g>

  <g stroke="#111827" stroke-width="2.4" fill="none">
    <line x1="332" y1="156" x2="363" y2="219" marker-end="url(#thinArrow)"/>
    <line x1="351" y1="126" x2="388" y2="202" marker-start="url(#thinArrow)"/>
    <line x1="370" y1="180" x2="326" y2="156" marker-end="url(#thinArrow)"/>
  </g>
</svg>
