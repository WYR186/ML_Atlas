<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">MDP GridWorld example</title>
  <desc id="desc">A three by four GridWorld with a start state, agent, stochastic movement arrows, a target, a positive terminal state, and a negative terminal state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="720" height="520" rx="24" fill="#f8fafc"/>
  <text x="360" y="50" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="800" fill="#111827">GridWorld MDP Example</text>
  <text x="360" y="78" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" fill="#64748b">States are cells, actions are moves, rewards guide the policy</text>

  <g transform="translate(118,102)">
    <rect x="0" y="0" width="480" height="360" fill="#d9efd0" stroke="#111827" stroke-width="2"/>
    <g stroke="#111827" stroke-width="1.5">
      <line x1="120" y1="0" x2="120" y2="360"/>
      <line x1="240" y1="0" x2="240" y2="360"/>
      <line x1="360" y1="0" x2="360" y2="360"/>
      <line x1="0" y1="120" x2="480" y2="120"/>
      <line x1="0" y1="240" x2="480" y2="240"/>
    </g>

    <g font-family="Inter, Arial, sans-serif" fill="#111827">
      <text x="-47" y="72" font-size="31" font-weight="700">3</text>
      <text x="-47" y="192" font-size="31" font-weight="700">2</text>
      <text x="-47" y="312" font-size="31" font-weight="700">1</text>
      <text x="174" y="405" font-size="31" font-weight="700">2</text>
      <text x="294" y="405" font-size="31" font-weight="700">3</text>
      <text x="414" y="405" font-size="31" font-weight="700">4</text>
      <text x="30" y="314" font-size="27" font-weight="800">Start</text>
    </g>

    <g transform="translate(180,180)" filter="url(#softShadow)">
      <circle r="47" fill="#e0f2fe"/>
      <circle r="37" fill="#ffffff" stroke="#111827" stroke-width="6"/>
      <circle r="24" fill="none" stroke="#111827" stroke-width="6"/>
      <circle r="11" fill="#111827"/>
    </g>

    <g transform="translate(420,60)">
      <text x="-50" y="-33" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900" fill="#111827">+1</text>
      <path d="M 0 -44 L 14 -14 L 47 -11 L 22 9 L 30 42 L 0 24 L -30 42 L -22 9 L -47 -11 L -14 -14 Z" fill="#f8fafc" stroke="#111827" stroke-width="6" stroke-linejoin="round"/>
    </g>

    <g transform="translate(420,180)">
      <path d="M 0 -47 L 10 -25 L 32 -38 L 25 -13 L 50 -10 L 28 4 L 45 24 L 18 22 L 11 48 L -3 26 L -24 43 L -21 16 L -49 13 L -24 -2 L -43 -24 L -15 -19 Z" fill="#111827"/>
      <text x="0" y="10" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff">-1</text>
    </g>

    <g transform="translate(300,300)">
      <path d="M -42 34 L -29 -6 L -9 16 L 0 -24 L 9 16 L 29 -6 L 42 34 Z" fill="#111827"/>
      <circle cx="0" cy="-34" r="9" fill="#111827"/>
      <rect x="-34" y="40" width="68" height="10" rx="3" fill="#111827"/>
    </g>

    <g stroke="#111827" stroke-width="3" marker-end="url(#arrow)" fill="none">
      <path d="M 300 274 L 300 222"/>
      <path d="M 270 300 L 210 300"/>
      <path d="M 330 300 L 390 300"/>
    </g>
  </g>
</svg>
