<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">PCA projects two-dimensional data onto the first principal component</title>
  <desc id="desc">A PCA diagram with Radius and Area axes, PC1 along the high-variance direction, PC2 perpendicular to it, and a 2D to 1D transformation note.</desc>
  <defs>
    <marker id="arrowBlack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f855a"/>
    </marker>
    <style>
      .axis{stroke:#111827;stroke-width:3;marker-end:url(#arrowBlack)}
      .pc{stroke:#2f855a;stroke-width:3;marker-end:url(#arrowGreen)}
      .fit{stroke:#b91c1c;stroke-width:3}
      .guide{stroke:#111827;stroke-width:3;fill:none}
      .point{stroke:#1e40af;stroke-width:2.5}
      .label{font:800 25px Arial,sans-serif;fill:#111827}
      .mid{font:700 18px Arial,sans-serif;fill:#111827}
      .small{font:700 15px Arial,sans-serif;fill:#111827}
      .card{fill:#ffffff;stroke:#e5e7eb;stroke-width:1.5;filter:url(#shadow)}
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="960" height="520" fill="#f8fafc"/>

  <g transform="translate(320,390)">
    <line class="axis" x1="0" y1="0" x2="318" y2="0"/>
    <line class="axis" x1="0" y1="0" x2="0" y2="-318"/>
    <text x="326" y="10" class="label">Radius</text>
    <text x="-30" y="-326" class="label">Area</text>

    <line class="pc" x1="0" y1="0" x2="260" y2="-250"/>
    <text x="256" y="-260" class="label">PC<tspan baseline-shift="sub" font-size="15">1</tspan></text>
    <text x="234" y="-285" class="small">Principal</text>
    <text x="236" y="-268" class="small">Component</text>

    <line class="pc" x1="0" y1="0" x2="-250" y2="-250"/>
    <text x="-280" y="-260" class="label">PC<tspan baseline-shift="sub" font-size="15">2</tspan></text>

    <line class="fit" x1="35" y1="0" x2="235" y2="-235"/>
    <line class="fit" x1="92" y1="0" x2="292" y2="-235"/>

    <g class="point">
      <path d="M 86 -66 L 98 -66 M 92 -72 L 92 -60"/>
      <path d="M 134 -112 L 146 -112 M 140 -118 L 140 -106"/>
      <path d="M 172 -151 L 184 -151 M 178 -157 L 178 -145"/>
      <path d="M 210 -188 L 222 -188 M 216 -194 L 216 -182"/>
      <path d="M 250 -230 L 262 -230 M 256 -236 L 256 -224"/>
      <path d="M 110 -178 L 122 -178 M 116 -184 L 116 -172"/>
      <path d="M 164 -254 L 176 -254 M 170 -260 L 170 -248"/>
    </g>

    <path class="guide" d="M 180 -42 C 210 -20 230 -22 252 -50"/>
    <line x1="196" y1="-58" x2="270" y2="-114" stroke="#111827" stroke-width="2"/>
    <text x="282" y="-66" class="label">Variance</text>

    <path class="guide" d="M -60 12 C -92 5 -95 -27 -68 -54"/>
    <line x1="-46" y1="8" x2="-30" y2="26" stroke="#111827" stroke-width="2"/>
    <text x="-150" y="42" class="label">Variance</text>
  </g>

  <rect class="card" x="700" y="85" width="210" height="80" rx="9"/>
  <text x="805" y="120" text-anchor="middle" class="label">Transformation</text>
  <text x="805" y="150" text-anchor="middle" class="label">2D-1D</text>

  <rect class="card" x="724" y="193" width="176" height="58" rx="9"/>
  <text x="812" y="231" text-anchor="middle" class="label">PC<tspan baseline-shift="sub" font-size="15">1</tspan> &gt; PC<tspan baseline-shift="sub" font-size="15">2</tspan></text>

  <text x="125" y="455" class="mid">PC1 captures the long direction of the cloud.</text>
  <text x="125" y="480" class="mid">Projecting onto PC1 turns 2D points into one coordinate.</text>
</svg>
