<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 400" role="img" aria-labelledby="title desc">
  <title id="title">Autoencoder bottleneck architecture</title>
  <desc id="desc">An autoencoder with six input nodes, three bottleneck hidden nodes, and six reconstructed output nodes.</desc>
  <defs>
    <style>
      .label { font: 700 18px Arial, sans-serif; fill: #111827; }
      .small { font: 600 15px Arial, sans-serif; fill: #111827; }
      .nodeText { font: 600 14px Arial, sans-serif; fill: #111827; }
      .wire { stroke: #111827; stroke-width: 1.3; fill: none; opacity: .86; }
      .pale { fill: #dff2d8; stroke: #111827; stroke-width: 1.1; }
      .code { fill: #20a464; stroke: #0f6f3e; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="432" height="400" fill="#f8fafc"/>

  <text x="22" y="44" class="label">Input Layer</text>
  <text x="154" y="44" class="label">Hidden Layer</text>
  <text x="291" y="44" class="label">Output Layer</text>
  <text x="160" y="126" class="label">bottleneck</text>

  <g id="wires-input-hidden">
    <line x1="77" y1="78" x2="196" y2="162" class="wire"/>
    <line x1="77" y1="78" x2="196" y2="221" class="wire"/>
    <line x1="77" y1="78" x2="196" y2="280" class="wire"/>
    <line x1="77" y1="137" x2="196" y2="162" class="wire"/>
    <line x1="77" y1="137" x2="196" y2="221" class="wire"/>
    <line x1="77" y1="137" x2="196" y2="280" class="wire"/>
    <line x1="77" y1="196" x2="196" y2="162" class="wire"/>
    <line x1="77" y1="196" x2="196" y2="221" class="wire"/>
    <line x1="77" y1="196" x2="196" y2="280" class="wire"/>
    <line x1="77" y1="255" x2="196" y2="162" class="wire"/>
    <line x1="77" y1="255" x2="196" y2="221" class="wire"/>
    <line x1="77" y1="255" x2="196" y2="280" class="wire"/>
    <line x1="77" y1="314" x2="196" y2="162" class="wire"/>
    <line x1="77" y1="314" x2="196" y2="221" class="wire"/>
    <line x1="77" y1="314" x2="196" y2="280" class="wire"/>
    <line x1="77" y1="373" x2="196" y2="162" class="wire"/>
    <line x1="77" y1="373" x2="196" y2="221" class="wire"/>
    <line x1="77" y1="373" x2="196" y2="280" class="wire"/>
  </g>

  <g id="wires-hidden-output">
    <line x1="212" y1="162" x2="333" y2="78" class="wire"/>
    <line x1="212" y1="162" x2="333" y2="137" class="wire"/>
    <line x1="212" y1="162" x2="333" y2="196" class="wire"/>
    <line x1="212" y1="162" x2="333" y2="255" class="wire"/>
    <line x1="212" y1="162" x2="333" y2="314" class="wire"/>
    <line x1="212" y1="162" x2="333" y2="373" class="wire"/>
    <line x1="212" y1="221" x2="333" y2="78" class="wire"/>
    <line x1="212" y1="221" x2="333" y2="137" class="wire"/>
    <line x1="212" y1="221" x2="333" y2="196" class="wire"/>
    <line x1="212" y1="221" x2="333" y2="255" class="wire"/>
    <line x1="212" y1="221" x2="333" y2="314" class="wire"/>
    <line x1="212" y1="221" x2="333" y2="373" class="wire"/>
    <line x1="212" y1="280" x2="333" y2="78" class="wire"/>
    <line x1="212" y1="280" x2="333" y2="137" class="wire"/>
    <line x1="212" y1="280" x2="333" y2="196" class="wire"/>
    <line x1="212" y1="280" x2="333" y2="255" class="wire"/>
    <line x1="212" y1="280" x2="333" y2="314" class="wire"/>
    <line x1="212" y1="280" x2="333" y2="373" class="wire"/>
  </g>

  <g id="input-nodes">
    <circle cx="59" cy="78" r="15" class="pale"/><text x="50" y="83" class="nodeText">X1</text>
    <circle cx="59" cy="137" r="15" class="pale"/><text x="50" y="142" class="nodeText">X2</text>
    <circle cx="59" cy="196" r="15" class="pale"/><text x="50" y="201" class="nodeText">X3</text>
    <circle cx="59" cy="255" r="15" class="pale"/><text x="50" y="260" class="nodeText">X4</text>
    <circle cx="59" cy="314" r="15" class="pale"/><text x="50" y="319" class="nodeText">X5</text>
    <circle cx="59" cy="373" r="15" class="pale"/><text x="50" y="378" class="nodeText">X6</text>
  </g>

  <g id="code-nodes">
    <circle cx="196" cy="162" r="15" class="code"/><text x="188" y="167" class="small">a1</text>
    <circle cx="196" cy="221" r="15" class="code"/><text x="188" y="226" class="small">a2</text>
    <circle cx="196" cy="280" r="15" class="code"/><text x="188" y="285" class="small">a3</text>
  </g>

  <g id="output-nodes">
    <circle cx="348" cy="78" r="15" class="pale"/><line x1="338" y1="67" x2="346" y2="67" class="wire"/><text x="337" y="83" class="nodeText">x1</text>
    <circle cx="348" cy="137" r="15" class="pale"/><line x1="338" y1="126" x2="346" y2="126" class="wire"/><text x="337" y="142" class="nodeText">x2</text>
    <circle cx="348" cy="196" r="15" class="pale"/><line x1="338" y1="185" x2="346" y2="185" class="wire"/><text x="337" y="201" class="nodeText">x3</text>
    <circle cx="348" cy="255" r="15" class="pale"/><line x1="338" y1="244" x2="346" y2="244" class="wire"/><text x="337" y="260" class="nodeText">x4</text>
    <circle cx="348" cy="314" r="15" class="pale"/><line x1="338" y1="303" x2="346" y2="303" class="wire"/><text x="337" y="319" class="nodeText">x5</text>
    <circle cx="348" cy="373" r="15" class="pale"/><line x1="338" y1="362" x2="346" y2="362" class="wire"/><text x="337" y="378" class="nodeText">x6</text>
  </g>
</svg>
