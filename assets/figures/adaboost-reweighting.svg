<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">AdaBoost reweighting pipeline</title>
  <desc id="desc">A three-round AdaBoost diagram showing original data, reweighted data, weak classifiers, mistakes receiving larger weights, and an ensemble classifier.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <style>
      .label{font:700 20px Arial,sans-serif;fill:#111827}
      .small{font:600 15px Arial,sans-serif;fill:#334155}
      .tiny{font:600 12px Arial,sans-serif;fill:#475569}
      .classifier{fill:#15803d}
      .correct{fill:none;stroke:#15803d;stroke-width:3}
      .wrong{fill:none;stroke:#b91c1c;stroke-width:3}
      .arrow{stroke:#111827;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .soft-arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .check{stroke:#15803d;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .cross{stroke:#b91c1c;stroke-width:4;fill:none;stroke-linecap:round}
    </style>
  </defs>

