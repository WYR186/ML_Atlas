<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Backpropagation through a neural network</title>
  <desc id="desc">A feed-forward neural network with input units, two hidden layers, one output unit, forward arrows, and backward gradient arrows used to update weights.</desc>
  <defs>
    <marker id="forwardArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="backArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .label { font-family: Inter, Arial, sans-serif; fill: #111827; }
      .muted { fill: #4b5563; }
      .edge { stroke: #111827; stroke-width: 1.9; fill: none; marker-end: url(#forwardArrow); }
      .back { stroke: #7c3aed; stroke-width: 2.5; fill: none; marker-end: url(#backArrow); }
      .input { fill: #fef9c3; stroke: #facc15; }
      .hidden1 { fill: #dcfce7; stroke: #86efac; }
      .hidden2 { fill: #e0f2fe; stroke: #7dd3fc; }
      .output { fill: #ffffff; stroke: #d1d5db; }
    </style>
  </defs>

  <rect width="1000" height="520" fill="#f8fafc"/>

  <g class="label" font-weight="800">
    <text x="86" y="270" font-size="27">Input</text>
    <text x="450" y="448" text-anchor="middle" font-size="27">Hidden</text>
    <text x="450" y="478" text-anchor="middle" font-size="27">Layers</text>
    <text x="748" y="354" text-anchor="middle" font-size="27">Output</text>
    <text x="748" y="384" text-anchor="middle" font-size="27">Layer</text>
    <text x="902" y="270" font-size="27">Output</text>
  </g>

  <text class="label" x="760" y="62" font-size="26" font-weight="800">Backward pass</text>
  <text class="label muted" x="760" y="93" font-size="20">gradients update earlier weights</text>
  <text class="label muted" x="760" y="119" font-size="20">using the chain rule</text>

  <g id="inputs" filter="url(#softShadow)">
    <circle class="input" cx="210" cy="95" r="38"/>
    <circle class="input" cx="210" cy="205" r="38"/>
    <circle class="input" cx="210" cy="315" r="38"/>
    <circle class="input" cx="210" cy="425" r="38"/>
  </g>
  <g class="label" font-size="26" font-weight="850" text-anchor="middle">
    <text x="210" y="104">a</text>
    <text x="210" y="214">b</text>
    <text x="210" y="324">c</text>
    <text x="210" y="434">d</text>
  </g>

  <g id="hidden1" filter="url(#softShadow)">
    <circle class="hidden1" cx="382" cy="135" r="38"/>
    <circle class="hidden1" cx="382" cy="260" r="38"/>
    <circle class="hidden1" cx="382" cy="385" r="38"/>
  </g>
  <g class="label" font-size="22" font-weight="850" text-anchor="middle">
    <text x="382" y="129">h</text>
    <text x="382" y="154">(1,1)</text>
    <text x="382" y="254">h</text>
    <text x="382" y="279">(1,2)</text>
    <text x="382" y="379">h</text>
    <text x="382" y="404">(1,3)</text>
  </g>

  <g id="hidden2" filter="url(#softShadow)">
    <circle class="hidden2" cx="560" cy="135" r="38"/>
    <circle class="hidden2" cx="560" cy="260" r="38"/>
    <circle class="hidden2" cx="560" cy="385" r="38"/>
  </g>
  <g class="label" font-size="22" font-weight="850" text-anchor="middle">
    <text x="560" y="129">h</text>
    <text x="560" y="154">(2,1)</text>
    <text x="560" y="254">h</text>
    <text x="560" y="279">(2,2)</text>
    <text x="560" y="379">h</text>
    <text x="560" y="404">(2,3)</text>
  </g>

  <g id="output" filter="url(#softShadow)">
    <circle class="output" cx="742" cy="260" r="38"/>
  </g>
  <text class="label" x="742" y="270" font-size="26" font-weight="850" text-anchor="middle">o</text>

  <g>
    <line class="edge" x1="54" y1="95" x2="158" y2="95"/>
    <line class="edge" x1="54" y1="205" x2="158" y2="205"/>
    <line class="edge" x1="54" y1="315" x2="158" y2="315"/>
    <line class="edge" x1="54" y1="425" x2="158" y2="425"/>
    <line class="edge" x1="780" y1="260" x2="880" y2="260"/>
  </g>

  <g opacity="0.95">
    <line class="edge" x1="248" y1="95" x2="344" y2="135"/>
    <line class="edge" x1="248" y1="95" x2="344" y2="260"/>
    <line class="edge" x1="248" y1="95" x2="344" y2="385"/>
    <line class="edge" x1="248" y1="205" x2="344" y2="135"/>
    <line class="edge" x1="248" y1="205" x2="344" y2="260"/>
    <line class="edge" x1="248" y1="205" x2="344" y2="385"/>
    <line class="edge" x1="248" y1="315" x2="344" y2="135"/>
    <line class="edge" x1="248" y1="315" x2="344" y2="260"/>
    <line class="edge" x1="248" y1="315" x2="344" y2="385"/>
    <line class="edge" x1="248" y1="425" x2="344" y2="135"/>
    <line class="edge" x1="248" y1="425" x2="344" y2="260"/>
    <line class="edge" x1="248" y1="425" x2="344" y2="385"/>

    <line class="edge" x1="420" y1="135" x2="522" y2="135"/>
    <line class="edge" x1="420" y1="135" x2="522" y2="260"/>
    <line class="edge" x1="420" y1="135" x2="522" y2="385"/>
    <line class="edge" x1="420" y1="260" x2="522" y2="135"/>
    <line class="edge" x1="420" y1="260" x2="522" y2="260"/>
    <line class="edge" x1="420" y1="260" x2="522" y2="385"/>
    <line class="edge" x1="420" y1="385" x2="522" y2="135"/>
    <line class="edge" x1="420" y1="385" x2="522" y2="260"/>
    <line class="edge" x1="420" y1="385" x2="522" y2="385"/>

    <line class="edge" x1="598" y1="135" x2="704" y2="260"/>
    <line class="edge" x1="598" y1="260" x2="704" y2="260"/>
    <line class="edge" x1="598" y1="385" x2="704" y2="260"/>
  </g>

  <path class="back" d="M728 208 C722 116 642 82 596 126"/>
  <path class="back" d="M548 92 C520 10 438 16 406 106"/>
  <path class="back" d="M364 90 C312 4 238 26 224 75"/>
  <text class="label" x="602" y="55" font-size="18" font-weight="750" text-anchor="middle">error signal</text>
  <text class="label" x="469" y="50" font-size="18" font-weight="750" text-anchor="middle">hidden gradients</text>
  <text class="label" x="300" y="48" font-size="18" font-weight="750" text-anchor="middle">weight updates</text>

  <g>
    <rect x="92" y="18" width="206" height="36" rx="18" fill="#ffffff" stroke="#d1d5db"/>
    <text class="label muted" x="195" y="42" font-size="17" font-weight="700" text-anchor="middle">forward pass: values</text>
    <rect x="716" y="147" width="218" height="38" rx="19" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text class="label" x="825" y="172" font-size="17" font-weight="750" text-anchor="middle">backward pass: gradients</text>
  </g>
</svg>
