<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Policy iteration critic actor cycle</title>
  <desc id="desc">Policy iteration alternates between policy evaluation, which computes a value function for the current policy, and policy improvement, which updates the policy greedily using the model.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 850; fill: #111827; }
      .label { font-size: 21px; font-weight: 800; fill: #ffffff; }
      .dark { font-size: 21px; font-weight: 800; fill: #111827; }
      .small { font-size: 15px; fill: #475569; }
      .green { fill: #15803d; stroke: #166534; stroke-width: 1.5; }
      .light { fill: #dcfce7; stroke: #86efac; stroke-width: 1.5; }
      .model { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="960" height="520" rx="18" fill="#f8fafc"/>
  <text x="480" y="62" text-anchor="middle" class="title">Policy Iteration</text>
  <text x="480" y="92" text-anchor="middle" class="small">Evaluate the current policy, then improve it greedily. Repeat until the policy stops changing.</text>

  <rect x="80" y="202" width="230" height="88" rx="8" class="green"/>
  <text x="195" y="236" text-anchor="middle" class="label">Policy Evaluation</text>
  <text x="195" y="264" text-anchor="middle" class="label">(critic)</text>

  <rect x="350" y="116" width="260" height="72" rx="8" class="light"/>
  <text x="480" y="160" text-anchor="middle" class="dark">Value function V^pi</text>

  <rect x="650" y="202" width="230" height="88" rx="8" class="green"/>
  <text x="765" y="236" text-anchor="middle" class="label">Policy Improvement</text>
  <text x="765" y="264" text-anchor="middle" class="label">(actor)</text>

  <rect x="350" y="344" width="260" height="72" rx="8" class="light"/>
  <text x="480" y="388" text-anchor="middle" class="dark">Policy pi</text>

  <rect x="74" y="340" width="112" height="58" rx="8" class="model"/>
  <text x="130" y="364" text-anchor="middle" class="dark" font-size="18">Model</text>
  <text x="130" y="386" text-anchor="middle" class="small">P, R</text>

  <g stroke="#111827" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M195 202 V132 H350"/>
    <path d="M610 152 H765 V202"/>
    <path d="M765 290 V380 H610"/>
    <path d="M350 380 H195 V290"/>
  </g>

  <g stroke="#111827" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M186 369 H242 V290"/>
    <path d="M480 344 V312 H310"/>
  </g>

  <text x="480" y="236" text-anchor="middle" font-size="23" font-weight="800" fill="#111827">loop</text>
  <text x="480" y="266" text-anchor="middle" class="small">stable policy means optimal for finite discounted MDPs</text>

  <text x="278" y="124" text-anchor="middle" class="small">compute V^pi</text>
  <text x="690" y="124" text-anchor="middle" class="small">greedy update</text>
  <text x="718" y="410" text-anchor="middle" class="small">new pi</text>
  <text x="250" y="414" text-anchor="middle" class="small">evaluate again</text>
</svg>
