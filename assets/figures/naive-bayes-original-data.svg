<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Original two-class data for Naive Bayes</title>
  <desc id="desc">A two-dimensional scatter plot with green circle examples for class y equals 1 and red square examples for class y equals 2.</desc>
  <defs>
    <marker id="axisArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="800" height="420" rx="22" fill="#f8fafc"/>
  <text x="400" y="58" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#111827">Original data</text>

  <g stroke="#111827" stroke-width="2" stroke-dasharray="4 5" fill="none" marker-end="url(#axisArrow)">
    <path d="M 62 238 H 710"/>
    <path d="M 368 376 V 96"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" fill="#111827">
    <text x="226" y="132" text-anchor="middle" font-size="23" font-weight="700">y = 1</text>
    <text x="574" y="116" text-anchor="middle" font-size="23" font-weight="700">y = 2</text>
    <text x="708" y="264" font-size="14" fill="#64748b">x<tspan baseline-shift="sub" font-size="10">1</tspan></text>
    <text x="340" y="106" font-size="14" fill="#64748b">x<tspan baseline-shift="sub" font-size="10">2</tspan></text>
  </g>

  <g filter="url(#softShadow)" stroke="#ffffff" stroke-width="3">
    <circle cx="236" cy="203" r="12" fill="#238b45"/>
    <circle cx="298" cy="196" r="12" fill="#238b45"/>
    <circle cx="228" cy="267" r="12" fill="#238b45"/>
    <circle cx="270" cy="283" r="12" fill="#238b45"/>
    <circle cx="205" cy="312" r="12" fill="#238b45"/>
    <circle cx="258" cy="316" r="12" fill="#238b45"/>

    <rect x="457" y="102" width="22" height="22" rx="2" fill="#bf1a0a"/>
    <rect x="492" y="126" width="22" height="22" rx="2" fill="#bf1a0a"/>
    <rect x="448" y="139" width="22" height="22" rx="2" fill="#bf1a0a"/>
    <rect x="445" y="192" width="22" height="22" rx="2" fill="#bf1a0a"/>
    <rect x="484" y="187" width="22" height="22" rx="2" fill="#bf1a0a"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">
    <text x="142" y="355">green circles: class y = 1</text>
    <text x="470" y="355">red squares: class y = 2</text>
  </g>
</svg>
