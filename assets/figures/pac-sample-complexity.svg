<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" role="img" aria-labelledby="title desc">
  <title id="title">PAC learning sample complexity</title>
  <desc id="desc">A PAC learning diagram showing that the number of examples depends on error tolerance, failure probability, and hypothesis class complexity.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <style>
      .label { font-family: Inter, Arial, sans-serif; fill: #111827; }
      .muted { fill: #4b5563; }
      .panel { fill: #dfe2ff; stroke: #5b6074; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.5; }
      .chip { fill: #ffffff; stroke: #b7bdd4; stroke-width: 1.5; }
      .call { stroke: #111827; stroke-width: 1.9; fill: none; marker-end: url(#arrow); }
      .soft { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="780" height="540" fill="#f8fafc"/>
  <rect class="panel" x="44" y="34" width="692" height="456" rx="8"/>

  <text class="label" x="390" y="82" text-anchor="middle" font-size="34" font-weight="850">PAC Learning Theory</text>
  <line x1="248" y1="91" x2="532" y2="91" stroke="#111827" stroke-width="2"/>
  <text class="label" x="390" y="122" text-anchor="middle" font-size="26" font-weight="760">(supervised concept learning)</text>

  <g filter="url(#shadow)">
    <rect class="box" x="132" y="382" width="516" height="74" rx="6"/>
  </g>
  <text class="label" x="390" y="431" text-anchor="middle" font-size="35" font-family="Georgia, serif">
    m ≥ 1/ε ( ln |H| + ln(1/δ) )
  </text>

  <g class="label" font-weight="850">
    <text x="86" y="184" font-size="28"># examples</text>
    <text x="256" y="184" font-size="28" font-style="italic">(m)</text>

    <text x="71" y="288" font-size="28">error rate</text>
    <text x="213" y="288" font-size="28" font-style="italic">(ε)</text>

    <text x="432" y="238" text-anchor="middle" font-size="28">representational</text>
    <text x="432" y="272" text-anchor="middle" font-size="28">complexity</text>
    <text x="571" y="272" font-size="28" font-style="italic">(|H|)</text>

    <text x="390" y="334" text-anchor="middle" font-size="28">failure</text>
    <text x="390" y="368" text-anchor="middle" font-size="28">probability</text>
    <text x="509" y="368" font-size="28" font-style="italic">(δ)</text>
  </g>

  <path class="call" d="M255 196 C292 248 326 300 361 378"/>
  <path class="call" d="M240 278 C302 266 353 257 411 244"/>
  <path class="call" d="M468 284 C454 313 432 345 406 381"/>
  <path class="call" d="M406 371 C403 379 400 386 397 394"/>

  <g>
    <rect class="soft" x="83" y="326" width="205" height="36" rx="18"/>
    <text class="label muted" x="186" y="350" text-anchor="middle" font-size="16" font-weight="700">smaller ε → more samples</text>

    <rect class="soft" x="476" y="173" width="202" height="38" rx="19"/>
    <text class="label muted" x="577" y="198" text-anchor="middle" font-size="16" font-weight="700">larger |H| → more samples</text>

    <rect class="soft" x="433" y="313" width="211" height="36" rx="18"/>
    <text class="label muted" x="539" y="337" text-anchor="middle" font-size="16" font-weight="700">smaller δ → more confidence</text>
  </g>

  <text class="label muted" x="390" y="516" text-anchor="middle" font-size="17">
    PAC asks how many random examples are enough to guarantee low true error with high probability.
  </text>
</svg>
