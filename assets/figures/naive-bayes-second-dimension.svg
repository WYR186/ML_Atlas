<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Estimating class conditional probability along the second feature dimension</title>
  <desc id="desc">Naive Bayes estimates a separate one-dimensional class conditional distribution for the second feature dimension.</desc>
  <defs>
    <marker id="axisArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="800" height="420" rx="22" fill="#f8fafc"/>
  <text x="400" y="58" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#111827">Estimation of Second Dimension</text>

  <g stroke="#111827" stroke-width="2" stroke-dasharray="4 5" fill="none" marker-end="url(#axisArrow)">
    <path d="M 44 236 H 714"/>
    <path d="M 382 362 V 92"/>
  </g>

  <g filter="url(#softShadow)">
    <path d="M 225 236 C 246 196 313 192 344 236 C 332 248 300 250 270 247 C 244 246 229 244 225 236 Z" fill="#dff3d7" stroke="#111827" stroke-width="1.2"/>
    <path d="M 427 236 C 439 194 479 171 501 206 C 511 222 517 232 532 236 C 505 244 451 244 427 236 Z" fill="#fee2e2" stroke="#111827" stroke-width="1.2"/>
  </g>

  <g stroke="#ffffff" stroke-width="3" filter="url(#softShadow)">
    <circle cx="240" cy="237" r="7" fill="#238b45"/>
    <circle cx="260" cy="237" r="7" fill="#238b45"/>
    <circle cx="280" cy="237" r="7" fill="#238b45"/>
    <circle cx="294" cy="237" r="7" fill="#238b45"/>
    <circle cx="322" cy="237" r="7" fill="#238b45"/>

    <rect x="424" y="228" width="16" height="16" rx="2" fill="#bf1a0a"/>
    <rect x="449" y="228" width="16" height="16" rx="2" fill="#bf1a0a"/>
    <rect x="469" y="228" width="16" height="16" rx="2" fill="#bf1a0a"/>
  </g>

  <g font-family="Inter, Arial, sans-serif" fill="#111827">
    <text x="216" y="173" font-size="24" font-weight="700">P(x<tspan baseline-shift="sub" font-size="15">2</tspan>|y = 1)</text>
    <text x="408" y="150" font-size="24" font-weight="700">P(x<tspan baseline-shift="sub" font-size="15">2</tspan>|y = 2)</text>
    <text x="704" y="260" font-size="14" fill="#64748b">x<tspan baseline-shift="sub" font-size="10">2</tspan></text>
    <text x="354" y="102" font-size="14" fill="#64748b">other feature</text>
  </g>
</svg>
