<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Self-supervised pretraining and finetuning workflow</title>
  <desc id="desc">A two-row workflow where unlabeled data trains a representation encoder on a pretext task, then the representation is reused with a classifier for a labeled downstream task.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#111827"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <style>
      .label { font-family: Inter, Arial, sans-serif; fill: #111827; }
      .muted { fill: #4b5563; }
      .box { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.4; }
      .green { fill: #22c55e; }
      .task { fill: #dcfce7; stroke: #bbf7d0; stroke-width: 1.4; }
      .encoder1 { fill: #7c3aed; stroke: #4c1d95; }
      .encoder2 { fill: #0ea5e9; stroke: #075985; }
      .flow { stroke: #111827; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .down { stroke: #111827; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1000" height="520" fill="#f8fafc"/>

  <text class="label" x="82" y="150" font-size="31" font-weight="850">Pretrain</text>
  <text class="label" x="82" y="365" font-size="31" font-weight="850">Finetune</text>

  <g filter="url(#shadow)" class="label" font-weight="800" text-anchor="middle">
    <g transform="translate(246 88)">
      <rect class="box" x="-38" y="-38" width="76" height="76" rx="12"/>
      <text x="0" y="10" font-size="34">cat</text>
    </g>
    <g transform="translate(358 78)">
      <rect class="box" x="-38" y="-38" width="76" height="76" rx="12"/>
      <text x="0" y="9" font-size="32">bird</text>
    </g>
    <g transform="translate(320 178)">
      <rect class="box" x="-38" y="-38" width="76" height="76" rx="12"/>
      <text x="0" y="9" font-size="32">bike</text>
    </g>
  </g>
  <text class="label muted" x="300" y="232" text-anchor="middle" font-size="17">unlabeled images</text>

  <g transform="translate(478 92)">
    <polygon class="encoder1" points="0,0 22,-18 22,105 0,123"/>
    <polygon class="encoder1" points="42,0 64,-18 64,105 42,123"/>
    <polygon class="encoder1" points="84,0 106,-18 106,105 84,123"/>
    <line class="flow" x1="30" y1="54" x2="52" y2="54"/>
    <line class="flow" x1="72" y1="54" x2="94" y2="54"/>
  </g>
  <text class="label muted" x="530" y="238" text-anchor="middle" font-size="17">encoder learns features</text>

  <rect class="green" x="620" y="46" width="44" height="180" rx="8"/>
  <text class="label white" x="647" y="139" text-anchor="middle" font-size="17" font-weight="850" transform="rotate(90 647 139)">Representation</text>
  <line class="flow" x1="668" y1="135" x2="728" y2="135"/>
  <line class="flow" x1="728" y1="167" x2="668" y2="167"/>
  <rect class="task" x="746" y="92" width="176" height="90" rx="12"/>
  <text class="label" x="834" y="126" text-anchor="middle" font-size="28" font-weight="850">Pretext</text>
  <text class="label" x="834" y="158" text-anchor="middle" font-size="28" font-weight="850">Task</text>

  <line class="down" x1="500" y1="234" x2="500" y2="286"/>
  <line class="down" x1="545" y1="234" x2="545" y2="286"/>
  <line class="down" x1="642" y1="234" x2="642" y2="286"/>
  <text class="label muted" x="572" y="276" text-anchor="middle" font-size="17">transfer encoder</text>

  <g filter="url(#shadow)" transform="translate(290 355)">
    <rect class="box" x="-66" y="-56" width="132" height="112" rx="14"/>
    <text class="label" x="0" y="-4" text-anchor="middle" font-size="38" font-weight="850">dog</text>
    <text class="label muted" x="0" y="30" text-anchor="middle" font-size="16">labeled sample</text>
  </g>

  <g transform="translate(476 302)">
    <polygon class="encoder2" points="0,0 22,-18 22,105 0,123"/>
    <polygon class="encoder2" points="42,0 64,-18 64,105 42,123"/>
    <line class="flow" x1="30" y1="54" x2="52" y2="54"/>
  </g>
  <rect class="green" x="618" y="302" width="44" height="132" rx="8"/>
  <text class="label white" x="645" y="371" text-anchor="middle" font-size="16" font-weight="850" transform="rotate(90 645 371)">Representation</text>
  <rect class="green" x="676" y="302" width="44" height="132" rx="8"/>
  <text class="label white" x="703" y="371" text-anchor="middle" font-size="16" font-weight="850" transform="rotate(90 703 371)">Classifier</text>
  <line class="flow" x1="724" y1="368" x2="784" y2="368"/>
  <line class="flow" x1="784" y1="400" x2="724" y2="400"/>

  <rect class="task" x="810" y="330" width="154" height="82" rx="12"/>
  <text class="label" x="887" y="381" text-anchor="middle" font-size="32" font-weight="850">Dog</text>

  <text class="label muted" x="500" y="492" text-anchor="middle" font-size="18">
    SSL first learns a reusable representation from unlabeled data, then adapts it with a small labeled task.
  </text>
</svg>
