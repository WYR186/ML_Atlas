<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-labelledby="title desc">
  <title id="title">Kernel lifting from a nonlinear 2D pattern to a linearly separable feature space</title>
  <desc id="desc">A circular class pattern in the input plane is lifted to a three-dimensional feature space where a flat plane can separate the classes.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="panelBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d8eef8"/>
      <stop offset="1" stop-color="#c3dfee"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="920" height="360" fill="#ffffff"/>

  <g transform="translate(36 28)">
    <text x="122" y="16" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">input space</text>
    <rect x="0" y="34" width="246" height="246" rx="4" fill="url(#panelBg)" stroke="#475569" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="123" cy="157" r="73" fill="#ef6c3a" opacity="0.86"/>

    <g fill="#8b5cf6">
      <circle cx="32" cy="60" r="4"/><circle cx="55" cy="88" r="4"/><circle cx="89" cy="52" r="4"/>
      <circle cx="162" cy="56" r="4"/><circle cx="204" cy="82" r="4"/><circle cx="226" cy="128" r="4"/>
      <circle cx="38" cy="150" r="4"/><circle cx="62" cy="210" r="4"/><circle cx="92" cy="244" r="4"/>
      <circle cx="164" cy="250" r="4"/><circle cx="210" cy="222" r="4"/><circle cx="232" cy="174" r="4"/>
      <circle cx="26" cy="246" r="4"/><circle cx="218" cy="44" r="4"/><circle cx="116" cy="72" r="4"/>
      <circle cx="82" cy="126" r="4"/><circle cx="196" cy="158" r="4"/><circle cx="142" cy="236" r="4"/>
    </g>
    <g fill="#ef4444">
      <circle cx="110" cy="130" r="4"/><circle cx="130" cy="124" r="4"/><circle cx="144" cy="144" r="4"/>
      <circle cx="92" cy="164" r="4"/><circle cx="122" cy="174" r="4"/><circle cx="154" cy="170" r="4"/>
      <circle cx="112" cy="202" r="4"/><circle cx="139" cy="206" r="4"/><circle cx="88" cy="122" r="4"/>
      <circle cx="174" cy="150" r="4"/><circle cx="106" cy="100" r="4"/><circle cx="148" cy="104" r="4"/>
    </g>
    <path d="M123 157 m-73 0 a73 73 0 1 0 146 0 a73 73 0 1 0 -146 0" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-dasharray="6 7" opacity="0.72"/>
    <text x="123" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">not linearly separable by one straight line</text>
  </g>

  <g transform="translate(356 0)">
    <path d="M18 180 H116" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="67" y="162" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#334155">kernel</text>
    <text x="67" y="204" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748b">implicit lift</text>
  </g>

  <g transform="translate(520 44)">
    <text x="180" y="0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">feature space</text>

    <polygon points="40,246 238,308 360,226 160,164" fill="url(#floor)" stroke="#64748b" stroke-width="1.5"/>
    <polygon points="160,38 360,98 360,226 160,164" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="40,120 160,38 160,164 40,246" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>

    <g stroke="#cbd5e1" stroke-width="1">
      <path d="M70 238 L190 156"/><path d="M104 249 L224 167"/><path d="M138 259 L258 177"/>
      <path d="M172 270 L292 188"/><path d="M206 281 L326 199"/>
      <path d="M70 229 L270 290"/><path d="M94 213 L294 274"/><path d="M118 197 L318 258"/>
      <path d="M142 181 L342 242"/>
      <path d="M160 38 L160 164"/><path d="M210 53 L210 179"/><path d="M260 68 L260 194"/><path d="M310 83 L310 209"/>
      <path d="M40 120 L160 164"/><path d="M40 162 L160 206"/><path d="M40 204 L160 248"/>
    </g>

    <path d="M88 180 C130 128, 204 92, 270 124 C316 147, 340 182, 342 214" fill="none" stroke="#60a5fa" stroke-width="2.2" opacity="0.85"/>
    <path d="M96 196 C150 154, 220 136, 306 164" fill="none" stroke="#a78bfa" stroke-width="1.8" opacity="0.75"/>
    <path d="M112 214 C170 184, 238 178, 328 196" fill="none" stroke="#34d399" stroke-width="1.8" opacity="0.75"/>
    <polygon points="82,176 315,146 350,166 120,198" fill="#fee2e2" stroke="#ef4444" stroke-width="2" opacity="0.72"/>
    <text x="296" y="140" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#b91c1c">linear plane</text>

    <g fill="#8b5cf6" stroke="#ffffff" stroke-width="1.2">
      <circle cx="78" cy="226" r="4.5"/><circle cx="118" cy="245" r="4.5"/><circle cx="184" cy="266" r="4.5"/>
      <circle cx="238" cy="282" r="4.5"/><circle cx="304" cy="224" r="4.5"/><circle cx="334" cy="198" r="4.5"/>
      <circle cx="88" cy="170" r="4.5"/><circle cx="142" cy="118" r="4.5"/><circle cx="224" cy="100" r="4.5"/>
      <circle cx="290" cy="130" r="4.5"/><circle cx="330" cy="170" r="4.5"/>
    </g>
    <g fill="#ef4444" stroke="#ffffff" stroke-width="1.2">
      <circle cx="150" cy="164" r="5"/><circle cx="176" cy="150" r="5"/><circle cx="204" cy="142" r="5"/>
      <circle cx="230" cy="146" r="5"/><circle cx="250" cy="162" r="5"/><circle cx="198" cy="172" r="5"/>
      <circle cx="220" cy="188" r="5"/><circle cx="170" cy="186" r="5"/>
    </g>
    <text x="188" y="332" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">a nonlinear pattern can become linear after lifting</text>
  </g>
</svg>
