<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">Q-learning algorithm loop</title>
  <desc id="desc">Flowchart showing Q-learning steps: initialize Q-table, choose action, perform action, measure reward, update Q-table, and repeat until terminal state.</desc>
  <defs>
    <marker id="arrowBlack" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#238c4b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="980" height="500" rx="24" fill="#f8fafc"/>
  <text x="490" y="54" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#111827">Q-learning Algorithm</text>

  <g font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" filter="url(#shadow)">
    <rect x="365" y="92" width="470" height="48" rx="4" fill="#d9efd0"/>
    <text x="600" y="123" fill="#111827">Initialize Q-table</text>

    <rect x="365" y="172" width="470" height="48" rx="4" fill="#d9efd0"/>
    <text x="600" y="203" fill="#111827">Choose an action</text>

    <rect x="365" y="252" width="470" height="48" rx="4" fill="#d9efd0"/>
    <text x="600" y="283" fill="#111827">Perform action</text>

    <rect x="365" y="332" width="470" height="48" rx="4" fill="#d9efd0"/>
    <text x="600" y="363" fill="#111827">Observe reward and next state</text>

    <rect x="365" y="412" width="470" height="48" rx="4" fill="#d9efd0"/>
    <text x="600" y="443" fill="#111827">Update Q-table</text>
  </g>

  <g stroke="#111827" stroke-width="3" marker-end="url(#arrowBlack)" fill="none">
    <path d="M600 142 L600 164"/>
    <path d="M600 222 L600 244"/>
    <path d="M600 302 L600 324"/>
    <path d="M600 382 L600 404"/>
  </g>

  <path d="M365 436 L300 436 L300 116 L355 116" stroke="#238c4b" stroke-width="3" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="182" y="265" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Repeat across</text>
  <text x="182" y="292" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">episodes until</text>
  <text x="182" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">terminal state</text>

  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#475569">
    <text x="850" y="123">Q(s,a) starts at 0 or optimistic values</text>
    <text x="850" y="203">epsilon-greedy: explore or exploit</text>
    <text x="850" y="283">environment returns s' and r</text>
    <text x="850" y="363">form TD target</text>
    <text x="850" y="443">old Q moves toward target</text>
  </g>
</svg>
