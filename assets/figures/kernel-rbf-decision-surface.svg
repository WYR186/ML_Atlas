<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 360" role="img" aria-labelledby="title desc">
  <title id="title">RBF kernel turns a surrounded cluster into a separable lifted surface</title>
  <desc id="desc">A compact red class surrounded by green points in two dimensions is lifted into a radial hill where a flat decision plane separates the red and green classes.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <radialGradient id="hill" cx="45%" cy="32%" r="70%">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.88"/>
      <stop offset="0.48" stop-color="#93c5fd" stop-opacity="0.44"/>
      <stop offset="1" stop-color="#e0f2fe" stop-opacity="0.12"/>
    </radialGradient>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#111827"/>
    </marker>
  </defs>

  <rect width="1040" height="360" fill="#ffffff"/>

  <g transform="translate(34 30)">
    <text x="205" y="0" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">original input space</text>
    <line x1="0" y1="292" x2="410" y2="292" stroke="#111827" stroke-width="2.6" marker-end="url(#arrow)"/>
    <line x1="0" y1="292" x2="0" y2="12" stroke="#111827" stroke-width="2.6" marker-end="url(#arrow)"/>
    <text x="405" y="318" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">$x_1$</text>
    <text x="-8" y="22" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">$x_2$</text>

    <ellipse cx="210" cy="152" rx="96" ry="74" fill="#fecaca" opacity="0.42" stroke="#fb7185" stroke-width="2" stroke-dasharray="7 7"/>
    <g fill="#bef264" stroke="#1d4ed8" stroke-width="3">
      <circle cx="62" cy="216" r="8"/><circle cx="88" cy="152" r="8"/><circle cx="126" cy="102" r="8"/>
      <circle cx="164" cy="76" r="8"/><circle cx="220" cy="54" r="8"/><circle cx="286" cy="82" r="8"/>
      <circle cx="340" cy="130" r="8"/><circle cx="354" cy="204" r="8"/><circle cx="314" cy="252" r="8"/>
      <circle cx="248" cy="272" r="8"/><circle cx="178" cy="264" r="8"/><circle cx="108" cy="248" r="8"/>
      <circle cx="76" cy="80" r="8"/><circle cx="360" cy="64" r="8"/><circle cx="374" cy="264" r="8"/>
      <circle cx="48" cy="270" r="8"/><circle cx="140" cy="204" r="8"/><circle cx="300" cy="190" r="8"/>
      <circle cx="240" cy="112" r="8"/><circle cx="112" cy="184" r="8"/>
    </g>
    <g fill="#ef4444" stroke="#111827" stroke-width="2">
      <rect x="174" y="116" width="16" height="16"/><rect x="208" y="104" width="16" height="16"/>
      <rect x="238" y="120" width="16" height="16"/><rect x="154" y="148" width="16" height="16"/>
      <rect x="190" y="146" width="16" height="16"/><rect x="224" y="150" width="16" height="16"/>
      <rect x="260" y="154" width="16" height="16"/><rect x="176" y="184" width="16" height="16"/>
      <rect x="214" y="184" width="16" height="16"/><rect x="248" y="188" width="16" height="16"/>
      <rect x="202" y="216" width="16" height="16"/><rect x="238" y="220" width="16" height="16"/>
    </g>
    <text x="205" y="334" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">one straight line cannot isolate the center cluster</text>
  </g>

  <g transform="translate(456 0)">
    <path d="M14 180 H116" stroke="#111827" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="65" y="150" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">kernel</text>
    <text x="65" y="208" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748b">RBF similarity</text>
  </g>

  <g transform="translate(594 26)" filter="url(#softShadow)">
    <text x="204" y="2" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">lifted feature space</text>
    <polygon points="22,268 222,326 430,228 232,170" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <g stroke="#d1d5db" stroke-width="1">
      <path d="M60 256 L268 158"/><path d="M98 267 L306 169"/><path d="M136 278 L344 180"/>
      <path d="M174 289 L382 191"/><path d="M212 300 L420 202"/>
      <path d="M62 247 L260 306"/><path d="M100 229 L298 288"/><path d="M138 211 L336 270"/>
      <path d="M176 193 L374 252"/><path d="M214 175 L412 234"/>
    </g>

    <path d="M102 226 C126 170, 154 110, 205 84 C254 58, 311 87, 342 148 C365 194, 352 228, 326 250 C266 224, 180 220, 102 226 Z" fill="url(#hill)" stroke="#38bdf8" stroke-width="2"/>
    <path d="M128 220 C154 178, 180 142, 218 126 C260 108, 305 128, 326 166" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.78"/>
    <path d="M146 236 C178 206, 226 190, 284 200 C316 206, 336 222, 348 238" fill="none" stroke="#60a5fa" stroke-width="1.5" opacity="0.72"/>
    <path d="M170 166 C206 136, 264 132, 304 166" fill="none" stroke="#f472b6" stroke-width="1.4" opacity="0.65"/>
    <polygon points="84,178 374,160 430,188 140,206" fill="#ffffff" stroke="#111827" stroke-width="2.8" opacity="0.86"/>
    <text x="345" y="142" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">flat decision boundary</text>
    <path d="M340 148 L316 169" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>

    <g fill="#bef264" stroke="#1d4ed8" stroke-width="3">
      <circle cx="68" cy="250" r="7"/><circle cx="100" cy="268" r="7"/><circle cx="136" cy="282" r="7"/>
      <circle cx="174" cy="294" r="7"/><circle cx="226" cy="306" r="7"/><circle cx="280" cy="286" r="7"/>
      <circle cx="326" cy="264" r="7"/><circle cx="374" cy="238" r="7"/><circle cx="398" cy="214" r="7"/>
      <circle cx="118" cy="230" r="7"/><circle cx="346" cy="222" r="7"/><circle cx="232" cy="264" r="7"/>
    </g>
    <g fill="#ef4444" stroke="#ffffff" stroke-width="1.4">
      <rect x="190" y="92" width="16" height="16"/><rect x="220" y="82" width="16" height="16"/>
      <rect x="250" y="96" width="16" height="16"/><rect x="172" y="124" width="16" height="16"/>
      <rect x="204" y="118" width="16" height="16"/><rect x="236" y="120" width="16" height="16"/>
      <rect x="270" y="132" width="16" height="16"/><rect x="192" y="150" width="16" height="16"/>
      <rect x="226" y="150" width="16" height="16"/><rect x="258" y="160" width="16" height="16"/>
      <rect x="214" y="178" width="16" height="16"/><rect x="246" y="184" width="16" height="16"/>
    </g>
    <text x="222" y="346" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">RBF lift makes center-vs-ring separation almost linear</text>
  </g>
</svg>
